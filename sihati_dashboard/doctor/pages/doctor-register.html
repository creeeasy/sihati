<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihati - Inscription Médecin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --surface: #1e2d45;
            --surface2: #243552;
            --border: rgba(99,179,237,0.10);
            --border2: rgba(99,179,237,0.18);
            --violet: #a78bfa;
            --violet-dim: rgba(167,139,250,0.12);
            --violet-glow: rgba(167,139,250,0.22);
            --violet-border: rgba(167,139,250,0.28);
            --violet-deep: #7c3aed;
            --gold: #f0a354;
            --gold-dim: rgba(240,163,84,0.12);
            --rose: #f87171;
            --rose-dim: rgba(248,113,113,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --font: 'Plus Jakarta Sans', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            position: relative;
        }

        /* ── Animated background ── */
        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0b0f1a 0%, #111827 50%, #0b0f1a 100%);
        }
        .bg-animated::before, .bg-animated::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }
        .bg-animated::before {
            width: 600px; height: 600px;
            background: var(--violet);
            top: -300px; right: -250px;
        }
        .bg-animated::after {
            width: 500px; height: 500px;
            background: var(--gold);
            bottom: -250px; left: -200px;
            animation-delay: -10s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 40px) scale(0.9); }
        }

        /* ── Auth Navbar ── */
        .auth-navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 64px;
            background: rgba(11, 15, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }
        .navbar-logo img {
            height: 32px;
            display: block;
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font);
        }
        .navbar-back:hover {
            color: var(--violet);
            border-color: var(--violet-border);
            background: var(--violet-dim);
        }
        .navbar-lang {
            width: 40px; height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .navbar-lang:hover {
            border-color: var(--violet-border);
            background: var(--violet-dim);
        }
        .navbar-lang img {
            width: 24px; height: 16px;
            border-radius: 3px;
            display: block;
        }

        /* ── Page layout ── */
        .register-container {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 88px 20px 48px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Logo section ── */
        .logo-section {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, var(--violet-deep), var(--violet));
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 36px var(--violet-glow);
        }
        .logo i { font-size: 34px; color: #fff; }
        .register-title {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--violet), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .register-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* ── Form card ── */
        .form-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            backdrop-filter: blur(10px);
        }

        /* ── Alerts ── */
        .alert-box {
            display: none;
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .alert-box i { font-size: 16px; flex-shrink: 0; }
        .alert-box.show { display: flex; }
        .alert-box.error {
            background: var(--rose-dim);
            border: 1px solid rgba(248,113,113,0.3);
            color: var(--rose);
        }
        .alert-box.success {
            background: var(--green-dim);
            border: 1px solid rgba(52,211,153,0.3);
            color: var(--green);
        }

        /* ── Form sections ── */
        .form-section {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .form-section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .form-section-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--violet);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group.full-width { grid-column: 1 / -1; }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 7px;
        }

        /* ── Inputs ── */
        .input-wrapper { position: relative; }
        .form-input, .form-select {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font);
            font-size: 13.5px;
            transition: all 0.2s ease;
            outline: none;
        }
        .input-wrapper .form-input { padding: 0 14px 0 44px; }
        .input-wrapper .form-input.has-toggle { padding-right: 44px; }
        .form-input.plain, .form-select { padding: 0 14px; }
        .form-input:focus, .form-select:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px var(--violet-dim);
        }
        .form-input::placeholder { color: var(--text-dim); }
        .form-input.is-invalid, .form-select.is-invalid { border-color: var(--rose); }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--violet);
            font-size: 15px;
            pointer-events: none;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 15px;
            transition: color 0.2s;
            padding: 4px;
        }
        .toggle-password:hover { color: var(--violet); }

        .invalid-feedback {
            font-size: 11px;
            color: var(--rose);
            margin-top: 5px;
            display: none;
        }
        .invalid-feedback.show { display: block; }

        /* ── GPS button ── */
        .btn-outline {
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--violet-border);
            border-radius: var(--radius-sm);
            color: var(--violet);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }
        .btn-outline:hover {
            background: var(--violet-dim);
            border-color: var(--violet);
        }

        /* ── Submit ── */
        .submit-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--violet-deep), var(--violet));
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--violet-glow);
        }
        .submit-btn:active:not(:disabled) { transform: translateY(0); }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Footer ── */
        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.8;
        }
        .footer-links a {
            color: var(--violet);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-links a:hover { color: var(--gold); }

        /* ── RTL overrides ── */
        [dir="rtl"] .input-icon { left: auto; right: 16px; }
        [dir="rtl"] .input-wrapper .form-input { padding: 0 44px 0 14px; }
        [dir="rtl"] .input-wrapper .form-input.has-toggle { padding-left: 44px; padding-right: 44px; }
        [dir="rtl"] .toggle-password { right: auto; left: 14px; }
        [dir="rtl"] .navbar-back i { transform: scaleX(-1); }

        @media (max-width: 640px) {
            .form-card { padding: 24px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .navbar-back span { display: none; }
        }
    </style>
</head>
<body>

<div class="bg-animated"></div>

<!-- Auth Navbar -->
<nav class="auth-navbar">
    <a href="../../index.html" class="navbar-logo">
        <img src="../../assets/icons/sihati_lockup.svg" alt="Sihati">
    </a>
    <div class="navbar-actions">
        <a href="../../index.html" class="navbar-back" id="backHomeBtn">
            <i class="fas fa-arrow-left"></i>
            <span id="backHomeText">Retour à l'accueil</span>
        </a>
        <button class="navbar-lang" id="langToggleBtn" title="Langue">
            <img id="langFlagImg" src="../../assets/icons/dz-flag.svg" alt="AR">
        </button>
    </div>
</nav>

<div class="register-container">

    <div class="logo-section">
        <div class="logo">
            <i class="fas fa-stethoscope"></i>
        </div>
        <h1 class="register-title" id="registerTitle">Sihati Médecin</h1>
        <p class="register-subtitle" id="registerSubtitle">Créez votre espace professionnel</p>
    </div>

    <div class="form-card">

        <div id="alertMsg" class="alert-box">
            <i id="alertIcon" class="fas fa-exclamation-circle"></i>
            <span id="alertText"></span>
        </div>

        <form id="registerForm" novalidate>

            <!-- Section 1: Connexion -->
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-envelope"></i>
                    <span id="sectionLogin">Informations de connexion</span>
                </div>

                <div class="form-group">
                    <label class="form-label" id="labelEmail">Email professionnel</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="dr.benali@exemple.com" autocomplete="email">
                    </div>
                    <div class="invalid-feedback" id="emailError"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" id="labelPassword">Mot de passe</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" class="form-input has-toggle" placeholder="8 caractères minimum" autocomplete="new-password">
                            <button type="button" class="toggle-password" id="togglePassword1">
                                <i class="fas fa-eye" id="toggleIcon1"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" id="passwordError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="labelConfirm">Confirmer mot de passe</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="confirmPassword" class="form-input has-toggle" placeholder="Retapez votre mot de passe" autocomplete="new-password">
                            <button type="button" class="toggle-password" id="togglePassword2">
                                <i class="fas fa-eye" id="toggleIcon2"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" id="confirmError"></div>
                    </div>
                </div>
            </div>

            <!-- Section 2: Informations personnelles -->
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-user-md"></i>
                    <span id="sectionPersonal">Informations personnelles</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" id="labelFullName">Nom complet</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="fullName" class="form-input" placeholder="Dr. Nom Prénom" autocomplete="name">
                        </div>
                        <div class="invalid-feedback" id="fullNameError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="labelPhone">Téléphone</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="tel" id="phoneNumber" class="form-input" placeholder="0555123456" autocomplete="tel">
                        </div>
                        <div class="invalid-feedback" id="phoneError"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" id="labelSpecialty">Spécialité</label>
                    <select id="specialtyId" class="form-select plain">
                        <option value="" id="specialtyPlaceholder">Sélectionnez une spécialité</option>
                        <option value="11111111-1111-1111-1111-111111111101">Médecine Générale</option>
                        <option value="11111111-1111-1111-1111-111111111102">Cardiologie</option>
                        <option value="11111111-1111-1111-1111-111111111103">Dermatologie</option>
                        <option value="11111111-1111-1111-1111-111111111104">Pédiatrie</option>
                        <option value="11111111-1111-1111-1111-111111111105">Gynécologie</option>
                    </select>
                    <div class="invalid-feedback" id="specialtyError"></div>
                </div>
            </div>

            <!-- Section 3: Cabinet -->
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-hospital-user"></i>
                    <span id="sectionClinic">Cabinet médical</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" id="labelClinicName">Nom du cabinet</label>
                        <div class="input-wrapper">
                            <i class="fas fa-clinic-medical input-icon"></i>
                            <input type="text" id="clinicName" class="form-input" placeholder="Clinique El Djazair">
                        </div>
                        <div class="invalid-feedback" id="clinicNameError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="labelClinicPhone">Téléphone cabinet</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone-office input-icon"></i>
                            <input type="tel" id="clinicPhone" class="form-input" placeholder="Optionnel">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" id="labelAddress">Adresse du cabinet</label>
                    <div class="input-wrapper">
                        <i class="fas fa-map-marker-alt input-icon"></i>
                        <input type="text" id="clinicAddress" class="form-input" placeholder="15 Rue Larbi Ben Mhidi">
                    </div>
                    <div class="invalid-feedback" id="addressError"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" id="labelWilaya">Wilaya</label>
                        <select id="wilaya" class="form-select plain">
                            <option value="" id="wilayaPlaceholder">Sélectionnez</option>
                            <option value="Adrar">Adrar</option>
                            <option value="Aïn Defla">Aïn Defla</option>
                            <option value="Aïn Témouchent">Aïn Témouchent</option>
                            <option value="Alger">Alger</option>
                            <option value="Annaba">Annaba</option>
                            <option value="Batna">Batna</option>
                            <option value="Béchar">Béchar</option>
                            <option value="Béjaïa">Béjaïa</option>
                            <option value="Béni Abbès">Béni Abbès</option>
                            <option value="Biskra">Biskra</option>
                            <option value="Blida">Blida</option>
                            <option value="Bordj Badji Mokhtar">Bordj Badji Mokhtar</option>
                            <option value="Bordj Bou Arréridj">Bordj Bou Arréridj</option>
                            <option value="Bouira">Bouira</option>
                            <option value="Boumerdès">Boumerdès</option>
                            <option value="Chlef">Chlef</option>
                            <option value="Constantine">Constantine</option>
                            <option value="Djanet">Djanet</option>
                            <option value="Djelfa">Djelfa</option>
                            <option value="El Bayadh">El Bayadh</option>
                            <option value="El M'Ghair">El M'Ghair</option>
                            <option value="El Meniaa">El Meniaa</option>
                            <option value="El Oued">El Oued</option>
                            <option value="El Tarf">El Tarf</option>
                            <option value="Ghardaïa">Ghardaïa</option>
                            <option value="Guelma">Guelma</option>
                            <option value="Illizi">Illizi</option>
                            <option value="In Guezzam">In Guezzam</option>
                            <option value="In Salah">In Salah</option>
                            <option value="Jijel">Jijel</option>
                            <option value="Khenchela">Khenchela</option>
                            <option value="Laghouat">Laghouat</option>
                            <option value="Mascara">Mascara</option>
                            <option value="Médéa">Médéa</option>
                            <option value="Mila">Mila</option>
                            <option value="Mostaganem">Mostaganem</option>
                            <option value="M'Sila">M'Sila</option>
                            <option value="Naâma">Naâma</option>
                            <option value="Oran">Oran</option>
                            <option value="Ouargla">Ouargla</option>
                            <option value="Ouled Djellal">Ouled Djellal</option>
                            <option value="Oum El Bouaghi">Oum El Bouaghi</option>
                            <option value="Relizane">Relizane</option>
                            <option value="Saïda">Saïda</option>
                            <option value="Sétif">Sétif</option>
                            <option value="Sidi Bel Abbès">Sidi Bel Abbès</option>
                            <option value="Skikda">Skikda</option>
                            <option value="Souk Ahras">Souk Ahras</option>
                            <option value="Tamanrasset">Tamanrasset</option>
                            <option value="Tébessa">Tébessa</option>
                            <option value="Tiaret">Tiaret</option>
                            <option value="Timimoun">Timimoun</option>
                            <option value="Tindouf">Tindouf</option>
                            <option value="Tipaza">Tipaza</option>
                            <option value="Tissemsilt">Tissemsilt</option>
                            <option value="Tizi Ouzou">Tizi Ouzou</option>
                            <option value="Tlemcen">Tlemcen</option>
                            <option value="Touggourt">Touggourt</option>
                        </select>
                        <div class="invalid-feedback" id="wilayaError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="labelCommune">Commune</label>
                        <div class="input-wrapper">
                            <i class="fas fa-city input-icon"></i>
                            <input type="text" id="commune" class="form-input" placeholder="Sidi M'hamed">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" id="labelFee">Frais de consultation (DA)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-money-bill-wave input-icon"></i>
                        <input type="number" id="consultationFee" class="form-input" placeholder="2500" min="0">
                    </div>
                </div>
            </div>

            <!-- Section 4: GPS -->
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-location-dot"></i>
                    <span id="sectionGps">Localisation GPS</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" id="labelLat">Latitude</label>
                        <div class="input-wrapper">
                            <i class="fas fa-arrows-up-down input-icon"></i>
                            <input type="text" id="latitude" class="form-input" placeholder="36.7638">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="labelLng">Longitude</label>
                        <div class="input-wrapper">
                            <i class="fas fa-arrows-left-right input-icon"></i>
                            <input type="text" id="longitude" class="form-input" placeholder="3.0488">
                        </div>
                    </div>
                </div>
                <button type="button" class="btn-outline" id="getLocationBtn">
                    <i class="fas fa-crosshairs"></i>
                    <span id="getLocationText">Utiliser ma position actuelle</span>
                </button>
            </div>

            <button type="submit" class="submit-btn" id="registerBtn">
                <i class="fas fa-user-plus"></i>
                <span id="registerBtnText">Créer mon compte médecin</span>
            </button>

        </form>

        <div class="footer-links">
            <p id="footerNote">Après inscription, votre compte devra être vérifié par un administrateur.</p>
            <p id="footerLogin">Déjà inscrit ? <a href="doctor-login.html">Se connecter</a></p>
        </div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/translations.js"></script>
<script src="../js/api.js"></script>
<script>
    // ── i18n ────────────────────────────────────────────────────────────
    // translations.js is loaded above and exposes the global t() function.
    // We alias it as s() for brevity throughout this file.
    const s = (key) => t(key);

    function applyRegisterI18n() {
        const lang = localStorage.getItem('sihati_lang') || 'fr';
        document.documentElement.lang = lang;
        document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';

        document.getElementById('backHomeText').textContent       = t('nav_back_home');
        document.getElementById('registerTitle').textContent      = t('register_title');
        document.getElementById('registerSubtitle').textContent   = t('register_subtitle');
        document.getElementById('sectionLogin').textContent       = t('section_login');
        document.getElementById('sectionPersonal').textContent    = t('section_personal');
        document.getElementById('sectionClinic').textContent      = t('section_clinic');
        document.getElementById('sectionGps').textContent         = t('section_gps');
        document.getElementById('labelEmail').textContent         = t('label_email');
        document.getElementById('labelPassword').textContent      = t('label_password');
        document.getElementById('labelConfirm').textContent       = t('label_confirm');
        document.getElementById('labelFullName').textContent      = t('label_fullname');
        document.getElementById('labelPhone').textContent         = t('label_phone');
        document.getElementById('labelSpecialty').textContent     = t('label_specialty');
        document.getElementById('labelClinicName').textContent    = t('label_clinic_name');
        document.getElementById('labelClinicPhone').textContent   = t('label_clinic_phone');
        document.getElementById('labelAddress').textContent       = t('label_address');
        document.getElementById('labelWilaya').textContent        = t('label_wilaya');
        document.getElementById('labelCommune').textContent       = t('label_commune');
        document.getElementById('labelFee').textContent           = t('label_fee');
        document.getElementById('labelLat').textContent           = t('label_lat');
        document.getElementById('labelLng').textContent           = t('label_lng');
        document.getElementById('getLocationText').textContent    = t('get_location');
        document.getElementById('registerBtnText').textContent    = t('register_btn');
        document.getElementById('footerNote').textContent         = t('footer_note');
        document.getElementById('footerLogin').innerHTML =
            t('footer_login') + ' <a href="doctor-login.html">' + t('login_link') + '</a>';
        document.getElementById('specialtyPlaceholder').textContent = t('specialty_placeholder');
        document.getElementById('wilayaPlaceholder').textContent    = t('wilaya_placeholder');

        // Flag: show the OTHER language's flag
        const flagImg = document.getElementById('langFlagImg');
        if (lang === 'fr') {
            flagImg.src = '../../assets/icons/dz-flag.svg'; flagImg.alt = 'AR';
        } else {
            flagImg.src = '../../assets/icons/fr-flag.svg'; flagImg.alt = 'FR';
        }
    }
    applyRegisterI18n();

    document.getElementById('langToggleBtn').addEventListener('click', () => {
        const cur = localStorage.getItem('sihati_lang') || 'fr';
        localStorage.setItem('sihati_lang', cur === 'fr' ? 'ar' : 'fr');
        window.location.reload();
    });

    // ── Alert helpers ───────────────────────────────────────────────────
    const alertDiv  = document.getElementById('alertMsg');
    const alertIcon = document.getElementById('alertIcon');
    const alertText = document.getElementById('alertText');

    function showAlert(msg, type) {
        alertDiv.className = 'alert-box ' + type + ' show';
        alertIcon.className = type === 'error'
            ? 'fas fa-exclamation-circle'
            : 'fas fa-check-circle';
        alertText.textContent = msg;
        alertDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        if (type === 'success') setTimeout(() => alertDiv.classList.remove('show'), 4000);
    }
    function showError(msg)   { showAlert(msg, 'error'); }
    function showSuccess(msg) { showAlert(msg, 'success'); }
    function hideAlert()      { alertDiv.classList.remove('show'); }

    // ── Password toggles ────────────────────────────────────────────────
    function makeToggle(btnId, iconId, inputId) {
        document.getElementById(btnId).addEventListener('click', function () {
            const input = document.getElementById(inputId);
            const icon  = document.getElementById(iconId);
            input.type  = input.type === 'password' ? 'text' : 'password';
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });
    }
    makeToggle('togglePassword1', 'toggleIcon1', 'password');
    makeToggle('togglePassword2', 'toggleIcon2', 'confirmPassword');

    // ── Validation ──────────────────────────────────────────────────────
    const VALIDATED_FIELDS = [
        'email', 'password', 'confirmPassword', 'fullName',
        'phoneNumber', 'specialtyId', 'clinicName', 'clinicAddress', 'wilaya'
    ];

    function clearFieldErrors() {
        VALIDATED_FIELDS.forEach(id => {
            const el  = document.getElementById(id);
            const err = document.getElementById(id + 'Error');
            if (el)  el.classList.remove('is-invalid');
            if (err) err.classList.remove('show');
        });
    }

    function markInvalid(id, msg) {
        const el  = document.getElementById(id);
        const err = document.getElementById(id + 'Error');
        if (el)  el.classList.add('is-invalid');
        if (err) { err.textContent = msg; err.classList.add('show'); }
    }

    function validateForm() {
        clearFieldErrors();
        let ok = true;

        const email = document.getElementById('email').value.trim();
        if (!email)                            { markInvalid('email', t('err_empty'));  ok = false; }
        else if (!/\S+@\S+\.\S+/.test(email)) { markInvalid('email', t('err_email')); ok = false; }

        const pwd = document.getElementById('password').value;
        if (!pwd)              { markInvalid('password', t('err_empty'));     ok = false; }
        else if (pwd.length < 8) { markInvalid('password', t('err_pwd_short')); ok = false; }

        const confirm = document.getElementById('confirmPassword').value;
        if (pwd !== confirm)   { markInvalid('confirmPassword', t('err_pwd_match')); ok = false; }

        const name = document.getElementById('fullName').value.trim();
        if (!name)             { markInvalid('fullName', t('err_empty'));      ok = false; }
        else if (name.length < 3) { markInvalid('fullName', t('err_name_short')); ok = false; }

        const phone = document.getElementById('phoneNumber').value.trim();
        if (!phone)                                { markInvalid('phoneNumber', t('err_empty'));        ok = false; }
        else if (!/^0[5-7][0-9]{8}$/.test(phone)) { markInvalid('phoneNumber', t('err_phone_format')); ok = false; }

        if (!document.getElementById('specialtyId').value)          { markInvalid('specialtyId',   t('err_specialty'));  ok = false; }
        if (!document.getElementById('clinicName').value.trim())    { markInvalid('clinicName',    t('err_clinic_name')); ok = false; }
        if (!document.getElementById('clinicAddress').value.trim()) { markInvalid('clinicAddress', t('err_address'));     ok = false; }
        if (!document.getElementById('wilaya').value)               { markInvalid('wilaya',        t('err_wilaya'));      ok = false; }

        return ok;
    }

    // ── GPS ─────────────────────────────────────────────────────────────
    document.getElementById('getLocationBtn').addEventListener('click', () => {
        if (!('geolocation' in navigator)) { showError(t('gps_unsupported')); return; }
        navigator.geolocation.getCurrentPosition(
            pos => {
                document.getElementById('latitude').value  = pos.coords.latitude.toFixed(6);
                document.getElementById('longitude').value = pos.coords.longitude.toFixed(6);
                showSuccess(t('gps_success'));
            },
            err => showError(t('gps_error') + err.message)
        );
    });

    // ── Submit ──────────────────────────────────────────────────────────
    const registerBtn = document.getElementById('registerBtn');

    function resetBtn() {
        registerBtn.disabled = false;
        registerBtn.innerHTML = `<i class="fas fa-user-plus"></i> <span>${t('register_btn')}</span>`;
    }

    document.getElementById('registerForm').addEventListener('submit', async e => {
        e.preventDefault();
        hideAlert();
        if (!validateForm()) return;

        registerBtn.disabled = true;
        registerBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t('registering')}`;

        const payload = {
            email:       document.getElementById('email').value.trim(),
            password:    document.getElementById('password').value,
            fullName:    document.getElementById('fullName').value.trim(),
            phoneNumber: document.getElementById('phoneNumber').value.trim(),
            role:        'doctor',
            doctorProfile: {
                specialtyId:     document.getElementById('specialtyId').value,
                doctorName:      document.getElementById('fullName').value.trim(),
                clinicName:      document.getElementById('clinicName').value.trim(),
                clinicAddress:   document.getElementById('clinicAddress').value.trim(),
                wilaya:          document.getElementById('wilaya').value,
                commune:         document.getElementById('commune').value.trim() || null,
                latitude:        parseFloat(document.getElementById('latitude').value)  || null,
                longitude:       parseFloat(document.getElementById('longitude').value) || null,
                phone:           document.getElementById('clinicPhone').value.trim()
                                    || document.getElementById('phoneNumber').value.trim(),
                consultationFee: parseInt(document.getElementById('consultationFee').value) || null,
            }
        };

        try {
            const res = await api.request('/auth/register', {
                method: 'POST',
                body:   JSON.stringify(payload)
            });

            if (res.success) {
                showSuccess(t('success_register'));
                setTimeout(() => { window.location.href = 'doctor-login.html'; }, 2000);
            } else {
                showError(res.message || t('server_error'));
                resetBtn();
            }
        } catch (err) {
            showError(err.message || t('server_error'));
            resetBtn();
        }
    });
</script>
</body>
</html>
