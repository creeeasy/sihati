<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sihati - Espace Médecin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/doctor-dashboard.css">
  <style>
    :root {
      --bg: #0b0f1a;
      --bg2: #111827;
      --bg3: #1a2235;
      --surface: #1e2d45;
      --surface2: #243552;
      --border: rgba(99,179,237,0.10);
      --border2: rgba(99,179,237,0.18);
      --teal: #2dd4bf;
      --teal-dim: rgba(45,212,191,0.12);
      --teal-glow: rgba(45,212,191,0.25);
      --blue: #60a5fa;
      --blue-dim: rgba(96,165,250,0.12);
      --amber: #fbbf24;
      --amber-dim: rgba(251,191,36,0.12);
      --rose: #f87171;
      --rose-dim: rgba(248,113,113,0.12);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.12);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --sidebar-w: 260px;
      --header-h: 72px;
      --radius: 14px;
      --radius-sm: 8px;
      --font: 'Sora', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.55);
    }

    .mobile-menu-btn {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      width: 36px;
      height: 36px;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      margin-right: 12px;
    }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
      .stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="brand">
      <div class="brand-icon">S</div>
      <div>
        <div class="brand-text">Sihati</div>
        <div class="brand-sub">Espace Medecin</div>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section">Principal</div>
    <a href="#" class="nav-link active" data-page="dashboard">
      <span class="nav-icon"><i class="fas fa-tachometer-alt"></i></span>
      <span>Tableau de bord</span>
    </a>
    <a href="#" class="nav-link" data-page="waiting-queue">
      <span class="nav-icon"><i class="fas fa-clock"></i></span>
      <span>File d'attente</span>
    </a>
    <a href="#" class="nav-link" data-page="appointments">
      <span class="nav-icon"><i class="fas fa-calendar-alt"></i></span>
      <span>Rendez-vous</span>
    </a>

    <div class="nav-section">Gestion</div>
    <a href="#" class="nav-link" data-page="patients">
      <span class="nav-icon"><i class="fas fa-users"></i></span>
      <span>Patients</span>
    </a>
    <a href="#" class="nav-link" data-page="availability">
      <span class="nav-icon"><i class="fas fa-clock"></i></span>
      <span>Disponibilites</span>
    </a>
    <a href="#" class="nav-link" data-page="reviews">
      <span class="nav-icon"><i class="fas fa-star"></i></span>
      <span>Avis patients</span>
    </a>

    <div class="nav-section">Compte</div>
    <a href="#" class="nav-link" data-page="profile">
      <span class="nav-icon"><i class="fas fa-user"></i></span>
      <span>Mon profil</span>
    </a>
  </nav>

  <div class="sidebar-profile">
    <div class="sidebar-profile-inner">
      <div class="doc-avatar" id="doctorAvatar">DR</div>
      <div class="doc-meta">
        <div class="doc-name" id="doctorName">Chargement...</div>
        <div class="doc-specialty" id="doctorSpecialty">Medecin</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Deconnexion">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </div>
</aside>

<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
      </button>
      <div>
        <h1 id="pageTitle">Tableau de bord</h1>
        <p id="pageSubtitle">Bienvenue dans votre espace professionnel</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="date-chip">
        <i class="fas fa-calendar-day"></i>
        <span id="dateDisplay"></span>
      </div>
      <div class="revenue-chip" id="revenueChip" style="display: none;">
        <i class="fas fa-coins"></i>
        <span id="revenueDisplay">0 DA</span>
      </div>
    </div>
  </header>

  <div id="pageContent">
    <div class="loading">
      <div class="spinner"></div>
      <p>Chargement en cours...</p>
    </div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal-container">
    <div class="modal-header">
      <h3 id="modalTitle">Titre</h3>
      <button id="modalCloseBtn" class="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  const now = new Date();
  document.getElementById('dateDisplay').textContent = now.toLocaleDateString('fr-FR', {
    weekday: 'long',
    day: 'numeric',
    month: 'long'
  });

  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const sidebar = document.getElementById('sidebar');
  if (mobileMenuBtn && sidebar) {
    mobileMenuBtn.addEventListener('click', function() {
      if (window.innerWidth <= 700) {
        if (sidebar.style.display === 'none' || getComputedStyle(sidebar).display === 'none') {
          sidebar.style.display = 'flex';
        } else {
          sidebar.style.display = 'none';
        }
      }
    });
    window.addEventListener('resize', function() {
      if (window.innerWidth > 700) {
        sidebar.style.display = '';
      }
    });
  }
</script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/doctor-auth.js"></script>
<script src="../js/doctor-dashboard.js"></script>
</body>
</html>
