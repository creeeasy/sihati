<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihati - Connexion Médecin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --surface: #1e2d45;
            --surface2: #243552;
            --border: rgba(99,179,237,0.10);
            --border2: rgba(99,179,237,0.18);
            --violet: #a78bfa;
            --violet-dim: rgba(167,139,250,0.12);
            --violet-glow: rgba(167,139,250,0.22);
            --violet-border: rgba(167,139,250,0.28);
            --violet-deep: #7c3aed;
            --gold: #f0a354;
            --gold-dim: rgba(240,163,84,0.12);
            --gold-glow: rgba(240,163,84,0.22);
            --gold-border: rgba(240,163,84,0.28);
            --rose: #f87171;
            --rose-dim: rgba(248,113,113,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --font: 'Plus Jakarta Sans', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0b0f1a 0%, #111827 50%, #0b0f1a 100%);
        }
        .bg-animated::before, .bg-animated::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }
        .bg-animated::before {
            width: 600px; height: 600px;
            background: var(--violet);
            top: -300px; right: -250px;
        }
        .bg-animated::after {
            width: 500px; height: 500px;
            background: var(--gold);
            bottom: -250px; left: -200px;
            animation-delay: -10s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 40px) scale(0.9); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 20px;
            animation: slideUp 0.8s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, var(--violet-deep), var(--violet));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 30px var(--violet-glow);
        }
        .logo i { font-size: 36px; color: #fff; }
        .login-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--violet), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            backdrop-filter: blur(10px);
        }

        .alert-box {
            display: none;
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            align-items: center;
            gap: 10px;
        }
        .alert-box i { font-size: 16px; }
        .alert-box.show { display: flex; }
        .alert-box.error {
            background: var(--rose-dim);
            border: 1px solid var(--rose);
            color: var(--rose);
        }
        .alert-box.success {
            background: var(--green-dim);
            border: 1px solid var(--green);
            color: var(--green);
        }

        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .input-wrapper { position: relative; }
        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--violet);
            box-shadow: 0 0 0 3px var(--violet-dim);
        }
        .form-input::placeholder { color: var(--text-dim); }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--violet);
            font-size: 16px;
        }
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--violet); }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
        }
        .remember-me input {
            width: 16px; height: 16px;
            cursor: pointer;
            accent-color: var(--violet);
        }
        .forgot-link {
            color: var(--violet);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-link:hover { color: var(--gold); }

        .submit-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--violet-deep), var(--violet));
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0 20px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider-text {
            color: var(--text-dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .register-link {
            display: block;
            text-align: center;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .register-link:hover {
            border-color: var(--violet);
            color: var(--violet);
            background: var(--violet-dim);
        }

        @media (max-width: 480px) {
            .form-card { padding: 24px; }
        }
    </style>
</head>
<body>

<div class="bg-animated"></div>

<div class="login-container">
    <div class="logo-section">
        <div class="logo">
            <i class="fas fa-stethoscope"></i>
        </div>
        <h1 class="login-title">Sihati Médecin</h1>
        <p class="login-subtitle">Connectez-vous à votre espace professionnel</p>
    </div>

    <div class="form-card">
        <div id="alertMsg" class="alert-box">
            <i id="alertIcon" class="fas fa-exclamation-circle"></i>
            <span id="alertText"></span>
        </div>

        <div class="form-group">
            <label class="form-label">Email professionnel</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" class="form-input" placeholder="dr.benali@exemple.com">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" class="form-input" placeholder="Mot de passe">
                <button type="button" class="toggle-password" id="togglePassword">
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
            </div>
        </div>

        <div class="options-row">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                <span>Se souvenir de moi</span>
            </label>
            <a href="#" class="forgot-link">Mot de passe oublié</a>
        </div>

        <button class="submit-btn" id="loginBtn">
            <i class="fas fa-arrow-right-to-bracket"></i>
            <span>Se connecter</span>
        </button>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">Nouveau sur Sihati</span>
            <div class="divider-line"></div>
        </div>

        <a href="doctor-register.html" class="register-link">
            <i class="fas fa-user-plus"></i> Créer un compte médecin
        </a>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../../assets/js/core.js"></script>
<script src="../js/api.js"></script>
<script>
    const alertDiv = document.getElementById('alertMsg');
    const alertIcon = document.getElementById('alertIcon');
    const alertText = document.getElementById('alertText');
    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberCheckbox = document.getElementById('rememberMe');

    function showError(message) {
        alertDiv.className = 'alert-box error show';
        alertIcon.className = 'fas fa-exclamation-circle';
        alertText.textContent = message;
        setTimeout(() => alertDiv.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
        alertDiv.className = 'alert-box success show';
        alertIcon.className = 'fas fa-check-circle';
        alertText.textContent = message;
    }

    function hideAlert() {
        alertDiv.classList.remove('show');
    }

    function saveCredentials(email, password) {
        if (rememberCheckbox.checked) {
            localStorage.setItem('doctorEmail', email);
            localStorage.setItem('doctorPassword', password);
        } else {
            localStorage.removeItem('doctorEmail');
            localStorage.removeItem('doctorPassword');
        }
    }

    function loadSavedCredentials() {
        const savedEmail = localStorage.getItem('doctorEmail');
        const savedPassword = localStorage.getItem('doctorPassword');
        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberCheckbox.checked = true;
        }
        if (savedPassword && rememberCheckbox.checked) {
            passwordInput.value = savedPassword;
        }
    }

    document.getElementById('togglePassword').addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        const icon = document.getElementById('toggleIcon');
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    });

    async function handleLogin() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        hideAlert();

        if (!email || !password) {
            showError('Veuillez remplir tous les champs');
            return;
        }

        loginBtn.disabled = true;
        const originalText = loginBtn.innerHTML;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';

        try {
            const res = await api.login(email, password);
            const user = STORAGE.getUser();

            if (user && user.role !== 'doctor') {
                showError('Accès réservé aux médecins');
                loginBtn.disabled = false;
                loginBtn.innerHTML = originalText;
                return;
            }

            if (res.success) {
                saveCredentials(email, password);
                showSuccess('Connexion réussie ! Redirection...');
                setTimeout(() => {
                    window.location.href = 'doctor-dashboard.html';
                }, 1000);
            } else {
                throw new Error(res.message || 'Email ou mot de passe incorrect');
            }
        } catch (err) {
            showError(err.message || 'Email ou mot de passe incorrect');
            loginBtn.disabled = false;
            loginBtn.innerHTML = originalText;
        }
    }

    loginBtn.addEventListener('click', handleLogin);

    passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });

    emailInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });

    loadSavedCredentials();
</script>
</body>
</html>
