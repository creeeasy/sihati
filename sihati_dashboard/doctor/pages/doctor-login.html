<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihati - Connexion Médecin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --surface: #1e2d45;
            --surface2: #243552;
            --border: rgba(99,179,237,0.10);
            --border2: rgba(99,179,237,0.18);
            --violet: #a78bfa;
            --violet-dim: rgba(167,139,250,0.12);
            --violet-glow: rgba(167,139,250,0.22);
            --violet-border: rgba(167,139,250,0.28);
            --violet-deep: #7c3aed;
            --gold: #f0a354;
            --gold-dim: rgba(240,163,84,0.12);
            --rose: #f87171;
            --rose-dim: rgba(248,113,113,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --font: 'Plus Jakarta Sans', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ── Animated background ── */
        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0b0f1a 0%, #111827 50%, #0b0f1a 100%);
        }
        .bg-animated::before, .bg-animated::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }
        .bg-animated::before {
            width: 600px; height: 600px;
            background: var(--violet);
            top: -300px; right: -250px;
        }
        .bg-animated::after {
            width: 500px; height: 500px;
            background: var(--gold);
            bottom: -250px; left: -200px;
            animation-delay: -10s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 40px) scale(0.9); }
        }

        /* ── Auth Navbar ── */
        .auth-navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 64px;
            background: rgba(11, 15, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }
        .navbar-logo img {
            height: 32px;
            display: block;
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font);
        }
        .navbar-back:hover {
            color: var(--violet);
            border-color: var(--violet-border);
            background: var(--violet-dim);
        }
        .navbar-lang {
            width: 40px; height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .navbar-lang:hover {
            border-color: var(--violet-border);
            background: var(--violet-dim);
        }
        .navbar-lang img {
            width: 24px; height: 16px;
            border-radius: 3px;
            display: block;
        }

        /* ── Login container ── */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 24px 20px 40px;
            margin-top: 64px;
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 64px);
        }
        .login-inner { width: 100%; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, var(--violet-deep), var(--violet));
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 36px var(--violet-glow);
        }
        .logo i { font-size: 34px; color: #fff; }
        .login-title {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--violet), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            backdrop-filter: blur(10px);
        }

        .alert-box {
            display: none;
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .alert-box i { font-size: 16px; flex-shrink: 0; }
        .alert-box.show { display: flex; }
        .alert-box.error {
            background: var(--rose-dim);
            border: 1px solid rgba(248,113,113,0.3);
            color: var(--rose);
        }
        .alert-box.success {
            background: var(--green-dim);
            border: 1px solid rgba(52,211,153,0.3);
            color: var(--green);
        }

        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .input-wrapper { position: relative; }
        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--violet);
            box-shadow: 0 0 0 3px var(--violet-dim);
        }
        .form-input::placeholder { color: var(--text-dim); }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--violet);
            font-size: 16px;
            pointer-events: none;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
            padding: 4px;
        }
        .toggle-password:hover { color: var(--violet); }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .remember-me input {
            width: 16px; height: 16px;
            cursor: pointer;
            accent-color: var(--violet);
        }
        .forgot-link {
            color: var(--violet);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-link:hover { color: var(--gold); }

        .submit-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--violet-deep), var(--violet));
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--violet-glow);
        }
        .submit-btn:active:not(:disabled) { transform: translateY(0); }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0 20px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider-text {
            color: var(--text-dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .register-link {
            display: block;
            text-align: center;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .register-link:hover {
            border-color: var(--violet);
            color: var(--violet);
            background: var(--violet-dim);
        }

        [dir="rtl"] .input-icon { left: auto; right: 16px; }
        [dir="rtl"] .form-input { padding: 0 44px 0 16px; }
        [dir="rtl"] .toggle-password { right: auto; left: 14px; }

        @media (max-width: 480px) {
            .form-card { padding: 24px; }
            .navbar-back span { display: none; }
        }
    </style>
</head>
<body>

<div class="bg-animated"></div>

<!-- Auth Navbar -->
<nav class="auth-navbar">
    <a href="../../index.html" class="navbar-logo">
        <img src="../../assets/icons/sihati_lockup.svg" alt="Sihati">
    </a>
    <div class="navbar-actions">
        <a href="../../index.html" class="navbar-back" id="backHomeBtn">
            <i class="fas fa-arrow-left"></i>
            <span id="backHomeText">Retour à l'accueil</span>
        </a>
        <button class="navbar-lang" id="langToggleBtn" title="Langue">
            <img id="langFlagImg" src="../../assets/icons/dz-flag.svg" alt="AR">
        </button>
    </div>
</nav>

<div class="login-container">
    <div class="login-inner">
        <div class="logo-section">
            <div class="logo">
                <i class="fas fa-stethoscope"></i>
            </div>
            <h1 class="login-title" id="loginTitle">Sihati Médecin</h1>
            <p class="login-subtitle" id="loginSubtitle">Connectez-vous à votre espace professionnel</p>
        </div>

        <div class="form-card">
            <div id="alertMsg" class="alert-box">
                <i id="alertIcon" class="fas fa-exclamation-circle"></i>
                <span id="alertText"></span>
            </div>

            <div class="form-group">
                <label class="form-label" id="labelEmail">Email professionnel</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" class="form-input" placeholder="dr.benali@exemple.com" autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" id="labelPassword">Mot de passe</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span id="rememberMeText">Se souvenir de moi</span>
                </label>
                <a href="doctor-forgot-password.html" class="forgot-link" id="forgotLink">Mot de passe oublié ?</a>
            </div>

            <button class="submit-btn" id="loginBtn">
                <i class="fas fa-arrow-right-to-bracket"></i>
                <span id="loginBtnText">Se connecter</span>
            </button>

            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text" id="dividerText">Nouveau sur Sihati</span>
                <div class="divider-line"></div>
            </div>

            <a href="doctor-register.html" class="register-link" id="registerLink">
                <i class="fas fa-user-plus"></i> <span id="registerLinkText">Créer un compte médecin</span>
            </a>
        </div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/translations.js"></script>
<script src="../js/api.js"></script>
<script>
    // ── Apply i18n ──────────────────────────────────────────────────────
    function applyAuthI18n() {
        const lang = localStorage.getItem('sihati_lang') || 'fr';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        document.getElementById('loginTitle').textContent       = t('login_title');
        document.getElementById('loginSubtitle').textContent    = t('login_subtitle');
        document.getElementById('labelEmail').textContent       = t('label_email');
        document.getElementById('labelPassword').textContent    = t('label_password');
        document.getElementById('rememberMeText').textContent   = t('remember_me');
        document.getElementById('forgotLink').textContent       = t('forgot_password');
        document.getElementById('loginBtnText').textContent     = t('login_btn');
        document.getElementById('dividerText').textContent      = t('divider_new');
        document.getElementById('registerLinkText').textContent = t('create_account');
        document.getElementById('backHomeText').textContent     = t('nav_back_home');

        // flag: show the OTHER language's flag
        const flagImg = document.getElementById('langFlagImg');
        if (lang === 'fr') {
            flagImg.src = '../../assets/icons/dz-flag.svg'; flagImg.alt = 'AR';
        } else {
            flagImg.src = '../../assets/icons/fr-flag.svg'; flagImg.alt = 'FR';
        }
    }
    applyAuthI18n();

    document.getElementById('langToggleBtn').addEventListener('click', () => {
        const cur = localStorage.getItem('sihati_lang') || 'fr';
        localStorage.setItem('sihati_lang', cur === 'fr' ? 'ar' : 'fr');
        window.location.reload();
    });

    // ── Alert helpers ───────────────────────────────────────────────────
    const alertDiv  = document.getElementById('alertMsg');
    const alertIcon = document.getElementById('alertIcon');
    const alertText = document.getElementById('alertText');
    const loginBtn  = document.getElementById('loginBtn');

    function showError(msg) {
        alertDiv.className = 'alert-box error show';
        alertIcon.className = 'fas fa-exclamation-circle';
        alertText.textContent = msg;
        alertDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    function showSuccess(msg) {
        alertDiv.className = 'alert-box success show';
        alertIcon.className = 'fas fa-check-circle';
        alertText.textContent = msg;
    }
    function hideAlert() { alertDiv.classList.remove('show'); }

    // ── Remember me ─────────────────────────────────────────────────────
    const emailInput    = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberCb    = document.getElementById('rememberMe');

    (function loadSaved() {
        const saved = localStorage.getItem('doctorEmail');
        const savedPwd = localStorage.getItem('doctorPassword');
        if (saved) { emailInput.value = saved; rememberCb.checked = true; }
        if (savedPwd && rememberCb.checked) passwordInput.value = savedPwd;
    })();

    function saveCredentials(email, pw) {
        if (rememberCb.checked) {
            localStorage.setItem('doctorEmail', email);
            localStorage.setItem('doctorPassword', pw);
        } else {
            localStorage.removeItem('doctorEmail');
            localStorage.removeItem('doctorPassword');
        }
    }

    // ── Toggle password visibility ──────────────────────────────────────
    document.getElementById('togglePassword').addEventListener('click', function() {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        document.getElementById('toggleIcon').classList.toggle('fa-eye');
        document.getElementById('toggleIcon').classList.toggle('fa-eye-slash');
    });

    // ── Login handler ───────────────────────────────────────────────────
    async function handleLogin() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        hideAlert();

        if (!email || !password) {
            showError(t('empty_fields_error'));
            return;
        }

        loginBtn.disabled = true;
        const origHTML = loginBtn.innerHTML;
        loginBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t('logging_in')}`;

        try {
            const res = await api.login(email, password);
            const user = STORAGE.getUser();

            if (user && user.role !== 'doctor') {
                showError(t('wrong_role_error'));
                loginBtn.disabled = false;
                loginBtn.innerHTML = origHTML;
                return;
            }

            if (res.success) {
                saveCredentials(email, password);
                showSuccess(t('login_success'));
                setTimeout(() => { window.location.href = 'doctor-dashboard.html'; }, 1000);
            } else {
                throw new Error(res.message || t('login_error'));
            }
        } catch (err) {
            showError(err.message || t('login_error'));
            loginBtn.disabled = false;
            loginBtn.innerHTML = origHTML;
        }
    }

    loginBtn.addEventListener('click', handleLogin);
    passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
    emailInput.addEventListener('keypress',    e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
