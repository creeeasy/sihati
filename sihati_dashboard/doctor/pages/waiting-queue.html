<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

    <a href="profile.html" class="nav-link" data-file="profile.html"><span class="nav-icon"><i class="fas fa-user"></i></span><span>Mon profil</span></a>

    </div>
    <div class="topbar-right">
      <div class="date-chip"><i class="fas fa-calendar-day"></i><span id="dateDisplay"></span></div>
      <button class="topbar-toggle lang-toggle" id="langToggleBtn"></button>
      <button class="topbar-toggle" id="themeToggleBtn"><i class="fas fa-sun"></i></button>
    </div>

  <div id="pageContent"><div class="loading"><div class="spinner"></div><p>Chargement...</p></div></div>
