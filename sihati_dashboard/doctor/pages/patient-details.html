<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihati - Détails Patient</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/doctor-dashboard.css">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --surface: #1e2d45;
            --surface2: #243552;
            --border: rgba(99,179,237,0.10);
            --border2: rgba(99,179,237,0.18);
            --violet: #a78bfa;
            --violet-dim: rgba(167,139,250,0.10);
            --violet-border: rgba(167,139,250,0.28);
            --violet-deep: #7c3aed;
            --gold: #f0a354;
            --gold-dim: rgba(240,163,84,0.10);
            --rose: #f87171;
            --rose-dim: rgba(248,113,113,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --font: 'Plus Jakarta Sans', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* FIX: Override overflow:hidden and height:100% from doctor-dashboard.css */
        html, body {
            height: auto !important;
            overflow: auto !important;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: block !important;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 99px; }

        .patient-details-page {
            width: 100%;
            min-height: 100vh;
            padding: 24px 32px;
        }

        /* Loading state */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            gap: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--violet-dim);
            border: 1px solid var(--violet-border);
            border-radius: var(--radius-sm);
            color: var(--violet);
            cursor: pointer;
            margin-bottom: 24px;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 20px;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: var(--violet);
            color: #fff;
        }

        .patient-header-card {
            background: linear-gradient(135deg, var(--violet-deep) 0%, var(--violet) 100%);
            border-radius: var(--radius);
            padding: 32px 40px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }
        .patient-header-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .patient-avatar-large {
            width: 88px;
            height: 88px;
            background: rgba(255,255,255,0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .patient-header-card h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .patient-header-card p {
            opacity: 0.8;
            font-size: 14px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }
        .info-card {
            background: var(--bg2);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .info-card:hover {
            border-color: var(--violet-border);
            background: var(--surface);
        }
        .info-card h3 {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-card .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .section-card {
            background: var(--bg2);
            border-radius: var(--radius);
            padding: 28px 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--violet);
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        .section-title i {
            font-size: 20px;
        }

        .consultation-item, .prescription-item, .allergy-item {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .consultation-item:hover, .prescription-item:hover, .allergy-item:hover {
            background: var(--surface);
        }
        .consultation-item:last-child, .prescription-item:last-child, .allergy-item:last-child {
            border-bottom: none;
        }

        .badge-severe {
            background: var(--rose-dim);
            color: var(--rose);
            border: 1px solid var(--rose-dim);
        }
        .badge-moderate {
            background: var(--gold-dim);
            color: var(--gold);
            border: 1px solid var(--gold-dim);
        }
        .badge-mild {
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid var(--green-dim);
        }
        .badge-pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .btn-icon {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            cursor: pointer;
            color: var(--rose);
            font-size: 14px;
            width: 36px;
            height: 36px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            background: var(--rose-dim);
            border-color: var(--rose);
            color: var(--rose);
        }

        .alert-error {
            background: var(--rose-dim);
            color: var(--rose);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-size: 13px;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface2);
            border-top-color: var(--violet);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-state {
            text-align: center;
            padding: 60px;
            color: var(--rose);
            font-size: 16px;
        }

        @media (max-width: 900px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .patient-details-page {
                padding: 20px;
            }
        }
        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .patient-header-card {
                padding: 24px;
            }
            .section-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="patient-details-page" id="patientDetailsContainer">
        <div class="loading-state">
            <lottie-player src="../../assets/animations/sihati_dna.json" background="transparent" speed="1" style="width:140px;height:140px;" loop autoplay></lottie-player>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay" style="display:none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Titre</h3>
                <button id="modalCloseBtn" class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/modals.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('id');
        let currentPatient = {};

        if (!patientId) {
            document.getElementById('patientDetailsContainer').innerHTML = '<div class="error-state">ID patient manquant</div>';
        } else {
            loadPatientDetails();
        }

        function setupModal() {
            const closeBtn = document.getElementById("modalCloseBtn");
            if (closeBtn) closeBtn.addEventListener("click", closeModal);
            const overlay = document.getElementById("modalOverlay");
            if (overlay) {
                overlay.addEventListener("click", (e) => {
                    if (e.target === overlay) closeModal();
                });
            }
        }

        async function loadPatientDetails() {
            const container = document.getElementById('patientDetailsContainer');
            try {
                const [patientRes, consultationsRes, prescriptionsRes, allergiesRes] = await Promise.all([
                    api.getPatientById(patientId).catch(() => ({ data: {} })),
                    api.getPatientConsultations(patientId).catch(() => ({ data: [] })),
                    api.getPatientPrescriptions(patientId).catch(() => ({ data: [] })),
                    api.getPatientAllergies(patientId).catch(() => ({ data: [] }))
                ]);
                currentPatient = patientRes.data || {};
                renderPatientDetails(container, currentPatient, consultationsRes.data || [], prescriptionsRes.data || [], allergiesRes.data || []);
            } catch (error) {
                container.innerHTML = `<div class="error-state">Erreur: ${error.message}</div>`;
            }
        }

        function renderPatientDetails(container, patient, consultations, prescriptions, allergies) {
            const initials = (patient.fullName || 'P').slice(0, 2).toUpperCase();
            container.innerHTML = `
                <button class="back-btn" onclick="window.location.href='doctor-dashboard.html'"><i class="fas fa-arrow-left"></i> Retour au tableau de bord</button>
                
                <div class="patient-header-card">
                    <div class="patient-avatar-large">${initials}</div>
                    <h1>${patient.fullName || 'Patient'}</h1>
                    <p>${patient.email || ''}</p>
                </div>
                
                <div class="info-grid">
                    <div class="info-card">
                        <h3><i class="fas fa-id-card"></i> Carte Chifa</h3>
                        <div class="value">${patient.chifaNumber || 'Non renseigné'}</div>
                    </div>
                    <div class="info-card">
                        <h3><i class="fas fa-phone"></i> Téléphone</h3>
                        <div class="value">${patient.phoneNumber || 'Non renseigné'}</div>
                    </div>
                    <div class="info-card">
                        <h3><i class="fas fa-calendar-alt"></i> Date d'inscription</h3>
                        <div class="value">${patient.createdAt ? new Date(patient.createdAt).toLocaleDateString('fr-FR') : 'N/A'}</div>
                    </div>
                </div>

                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-allergies"></i> Allergies
                        <button class="btn-icon" style="margin-left:auto;" onclick="addAllergyFromDetails('${patient.id}')"><i class="fas fa-plus"></i></button>
                    </div>
                    ${allergies.length > 0 ? allergies.map(a => `
                        <div class="allergy-item">
                            <div style="display:flex;justify-content:space-between; align-items:center;">
                                <div>
                                    <strong>${a.allergyName}</strong>
                                    <span class="badge-pill badge-${a.severity}" style="margin-left: 10px;">${a.severity === 'mild' ? 'Légère' : a.severity === 'moderate' ? 'Modérée' : 'Sévère'}</span>
                                </div>
                                <button class="btn-icon" onclick="deleteAllergyFromDetails('${a.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                            ${a.reaction ? `<div style="font-size:13px; color: var(--text-muted); margin-top:8px;">Réaction: ${a.reaction}</div>` : ''}
                        </div>
                    `).join('') : '<div style="padding: 20px 0; text-align: center; color: var(--text-muted);">Aucune allergie enregistrée</div>'}
                </div>

                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-stethoscope"></i> Consultations (${consultations.length})
                        <button class="btn-icon" style="margin-left:auto;" onclick="showConsultationModal('${patient.id}', '${patient.fullName}')"><i class="fas fa-plus"></i></button>
                    </div>
                    ${consultations.length > 0 ? consultations.map(c => `
                        <div class="consultation-item">
                            <div style="display:flex;justify-content:space-between; margin-bottom: 8px;">
                                <strong>${new Date(c.consultationDate).toLocaleDateString('fr-FR')}</strong>
                                ${c.feePaid ? `<span style="color: var(--gold); font-weight: 600;">${formatCurrency(c.feePaid)}</span>` : ''}
                            </div>
                            <div><strong>Motif:</strong> ${c.chiefComplaint || '-'}</div>
                            <div><strong>Diagnostic:</strong> ${c.diagnosis || '-'}</div>
                            <div><strong>Traitement:</strong> ${c.treatmentPlan || '-'}</div>
                            ${c.notes ? `<div style="margin-top:8px; padding:10px; background:var(--surface); border-radius:var(--radius-sm);"><strong>Notes:</strong> ${c.notes}</div>` : ''}
                        </div>
                    `).join('') : '<div style="padding: 20px 0; text-align: center; color: var(--text-muted);">Aucune consultation</div>'}
                </div>

                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-pills"></i> Ordonnances (${prescriptions.length})
                        <button class="btn-icon" style="margin-left:auto;" onclick="showPrescriptionModal('${patient.id}', '${patient.fullName}')"><i class="fas fa-plus"></i></button>
                    </div>
                    ${prescriptions.length > 0 ? prescriptions.map(p => `
                        <div class="prescription-item">
                            <div style="display:flex;justify-content:space-between; margin-bottom: 8px;">
                                <strong>${new Date(p.prescriptionDate).toLocaleDateString('fr-FR')}</strong>
                                <span class="badge-pill ${p.isRenewable ? 'badge-mild' : 'badge-moderate'}">${p.isRenewable ? 'Renouvelable' : 'Simple'}</span>
                            </div>
                            <div><strong>Diagnostic:</strong> ${p.diagnosis || '-'}</div>
                            ${p.medications && p.medications.length > 0 ? `
                                <div style="margin-top:8px;">
                                    <strong>Médicaments:</strong>
                                    <ul style="margin-top: 6px; margin-left: 20px; color: var(--text-muted);">
                                        ${p.medications.map(m => `<li>${m.medicationName} ${m.dosage ? `- ${m.dosage}` : ''} ${m.frequency ? `(${m.frequency})` : ''}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            ${p.instructions ? `<div style="margin-top:8px; color: var(--text-muted);"><strong>Instructions:</strong> ${p.instructions}</div>` : ''}
                        </div>
                    `).join('') : '<div style="padding: 20px 0; text-align: center; color: var(--text-muted);">Aucune ordonnance</div>'}
                </div>
            `;
        }

        function addAllergyFromDetails(patientId) {
            openModal(`Ajouter une allergie`, `
                <div id="allergyAlert"></div>
                <div class="form-group"><label>Nom de l'allergie</label><input class="modal-input" type="text" id="a_name" placeholder="Ex: Pénicilline"></div>
                <div class="form-group"><label>Type</label><select class="modal-input" id="a_type"><option value="medication">Médicament</option><option value="food">Aliment</option><option value="environmental">Environnemental</option></select></div>
                <div class="form-group"><label>Sévérité</label><select class="modal-input" id="a_severity"><option value="mild">Légère</option><option value="moderate">Modérée</option><option value="severe">Sévère</option></select></div>
                <div class="form-group"><label>Réaction</label><textarea class="modal-input" id="a_reaction" rows="2" placeholder="Description de la réaction..."></textarea></div>
                <div class="modal-actions"><button class="btn-cancel-modal" onclick="closeModal()">Annuler</button><button class="btn-save-modal" onclick="saveAllergyFromDetails('${patientId}')">Enregistrer</button></div>
            `);
            setupModal();
        }

        async function saveAllergyFromDetails(patientId) {
            const alertEl = document.getElementById("allergyAlert");
            const name = document.getElementById("a_name").value.trim();
            if(!name) { 
                alertEl.innerHTML = `<div class="alert-error">Le nom de l'allergie est obligatoire</div>`; 
                return; 
            }
            try {
                await api.createAllergy(patientId, { 
                    allergyName: name, 
                    allergyType: document.getElementById("a_type").value, 
                    severity: document.getElementById("a_severity").value, 
                    reaction: document.getElementById("a_reaction").value.trim() 
                });
                closeModal(); 
                showToast("Allergie ajoutée", "success"); 
                setTimeout(() => location.reload(), 1000);
            } catch(e) { 
                alertEl.innerHTML = `<div class="alert-error">${e.message}</div>`; 
            }
        }

        async function deleteAllergyFromDetails(allergyId) {
            if(!confirm("Supprimer cette allergie ?")) return;
            try { 
                await api.deleteAllergy(allergyId); 
                showToast("Allergie supprimée", "success"); 
                setTimeout(() => location.reload(), 1000);
            } catch(e) { 
                showToast("Erreur lors de la suppression", "error"); 
            }
        }

        window.addAllergyFromDetails = addAllergyFromDetails;
        window.saveAllergyFromDetails = saveAllergyFromDetails;
        window.deleteAllergyFromDetails = deleteAllergyFromDetails;
        window.closeModal = closeModal;

        // ── Consultation save (mirrors patients.js) ────────────────────────
        window.saveConsultation = async function(patientId) {
            const alertEl = document.getElementById('consultAlert');
            const chiefComplaint = document.getElementById('c_complaint')?.value.trim();
            if (!chiefComplaint) {
                if (alertEl) alertEl.innerHTML = `<div class="alert-error">${t('fill_all_fields')}</div>`;
                return;
            }
            const data = {
                patientId,
                chiefComplaint,
                diagnosis:     document.getElementById('c_diagnosis')?.value.trim(),
                treatmentPlan: document.getElementById('c_treatment')?.value.trim(),
                notes:         document.getElementById('c_notes')?.value.trim(),
                feePaid: parseFloat(document.getElementById('c_fee')?.value) || null
            };
            const btn = document.querySelector('#modalBody .btn-save-modal');
            if (btn) { btn.classList.add('btn-loading'); btn.disabled = true; }
            try {
                await api.createConsultation(data);
                closeModal();
                showToast(t('consultation_saved') || 'Consultation enregistrée', 'success');
                setTimeout(() => location.reload(), 1200);
            } catch(e) {
                if (alertEl) alertEl.innerHTML = `<div class="alert-error">${e.message}</div>`;
            } finally {
                if (btn) { btn.classList.remove('btn-loading'); btn.disabled = false; }
            }
        };

        // ── Prescription save (mirrors patients.js) ───────────────────────
        window.savePrescription = async function(patientId) {
            const alertEl = document.getElementById('prescAlert');
            const rows = document.querySelectorAll('.medication-row');
            const medications = [];
            let valid = true;
            rows.forEach(row => {
                const name = row.querySelector('.med-name')?.value.trim();
                if (!name) { valid = false; return; }
                medications.push({
                    name,
                    dosage:      row.querySelector('.med-dosage')?.value.trim(),
                    frequency:   row.querySelector('.med-frequency')?.value.trim(),
                    durationDays:row.querySelector('.med-duration')?.value.trim()
                });
            });
            if (!valid || !medications.length) {
                if (alertEl) alertEl.innerHTML = `<div class="alert-error">${t('add_medication')}</div>`;
                return;
            }
            const data = {
                patientId,
                doctorId:     api.getDoctorId(),
                diagnosis:    document.getElementById('p_diagnosis')?.value.trim(),
                medications,
                instructions: document.getElementById('p_instructions')?.value.trim(),
                validityDays: 30,
                isRenewable:  document.getElementById('p_renewable')?.value === 'true'
            };
            const btn = document.querySelector('#modalBody .btn-save-modal');
            if (btn) { btn.classList.add('btn-loading'); btn.disabled = true; }
            try {
                await api.createPrescription(data);
                closeModal();
                showToast(t('prescription_saved') || 'Ordonnance enregistrée', 'success');
                setTimeout(() => location.reload(), 1200);
            } catch(e) {
                if (alertEl) alertEl.innerHTML = `<div class="alert-error">${e.message}</div>`;
            } finally {
                if (btn) { btn.classList.remove('btn-loading'); btn.disabled = false; }
            }
        };

        setupModal();
    </script>
</body>
</html>
