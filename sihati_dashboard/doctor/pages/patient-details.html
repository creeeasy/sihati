<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihati - Détails Patient</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --surface: #1e2d45;
            --surface2: #243552;
            --border: rgba(99,179,237,0.10);
            --border2: rgba(99,179,237,0.18);
            --violet: #a78bfa;
            --violet-dim: rgba(167,139,250,0.10);
            --violet-border: rgba(167,139,250,0.28);
            --violet-deep: #7c3aed;
            --gold: #f0a354;
            --gold-dim: rgba(240,163,84,0.10);
            --rose: #f87171;
            --rose-dim: rgba(248,113,113,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --font: 'Plus Jakarta Sans', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 99px; }

        .patient-details-page {
            width: 100%;
            min-height: 100vh;
            padding: 24px 32px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--violet-dim);
            border: 1px solid var(--violet-border);
            border-radius: var(--radius-sm);
            color: var(--violet);
            cursor: pointer;
            margin-bottom: 24px;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 20px;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: var(--violet);
            color: #fff;
        }

        .patient-header-card {
            background: linear-gradient(135deg, var(--violet-deep) 0%, var(--violet) 100%);
            border-radius: var(--radius);
            padding: 32px 40px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }
        .patient-header-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .patient-avatar-large {
            width: 88px;
            height: 88px;
            background: rgba(255,255,255,0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .patient-header-card h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .patient-header-card p {
            opacity: 0.8;
            font-size: 14px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }
        .info-card {
            background: var(--bg2);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .info-card:hover {
            border-color: var(--violet-border);
            background: var(--surface);
        }
        .info-card h3 {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-card .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .section-card {
            background: var(--bg2);
            border-radius: var(--radius);
            padding: 28px 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--violet);
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        .section-title i {
            font-size: 20px;
        }

        .consultation-item, .prescription-item, .allergy-item {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .consultation-item:hover, .prescription-item:hover, .allergy-item:hover {
            background: var(--surface);
        }
        .consultation-item:last-child, .prescription-item:last-child, .allergy-item:last-child {
            border-bottom: none;
        }

        .badge-severe {
            background: var(--rose-dim);
            color: var(--rose);
            border: 1px solid var(--rose-dim);
        }
        .badge-moderate {
            background: var(--gold-dim);
            color: var(--gold);
            border: 1px solid var(--gold-dim);
        }
        .badge-mild {
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid var(--green-dim);
        }
        .badge-pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .btn-icon {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            cursor: pointer;
            color: var(--rose);
            font-size: 14px;
            width: 36px;
            height: 36px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            background: var(--rose-dim);
            border-color: var(--rose);
            color: var(--rose);
        }

        .medication-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }
        .med-input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 10px 12px;
            color: var(--text);
            font-family: var(--font);
            font-size: 13px;
            outline: none;
        }
        .med-input:focus {
            border-color: var(--violet);
        }
        .btn-remove-med {
            width: 36px;
            height: 36px;
            background: var(--rose-dim);
            color: var(--rose);
            border: 1px solid var(--rose-dim);
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-remove-med:hover {
            background: var(--rose);
            color: #fff;
        }
        .btn-add-med {
            padding: 10px 16px;
            background: var(--violet-dim);
            color: var(--violet);
            border: 1px dashed var(--violet-border);
            border-radius: var(--radius-xs);
            cursor: pointer;
            margin-bottom: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-add-med:hover {
            background: var(--violet);
            color: #fff;
            border-style: solid;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-container {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            width: 100%;
            max-width: 560px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: var(--rose-dim);
            color: var(--rose);
        }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
        }
        .modal-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }
        .modal-input:focus {
            border-color: var(--violet);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
        }
        .btn-cancel-modal {
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
        }
        .btn-cancel-modal:hover {
            color: var(--text);
        }
        .btn-save-modal {
            padding: 10px 24px;
            background: var(--violet);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .btn-save-modal:hover {
            filter: brightness(1.08);
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .alert-error {
            background: var(--rose-dim);
            color: var(--rose);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-size: 13px;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface2);
            border-top-color: var(--violet);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-state {
            text-align: center;
            padding: 60px;
            color: var(--rose);
            font-size: 16px;
        }

        @media (max-width: 900px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .patient-details-page {
                padding: 20px;
            }
        }
        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .patient-header-card {
                padding: 24px;
            }
            .section-card {
                padding: 20px;
            }
            .medication-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="patient-details-page" id="patientDetailsContainer">
        <div class="loading-spinner"><div class="spinner"></div><p>Chargement...</p></div>
    </div>

    <div id="modalOverlay" class="modal-overlay" style="display:none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Titre</h3>
                <button id="modalCloseBtn" class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('id');
        let currentPatient = {};

        if (!patientId) {
            document.getElementById('patientDetailsContainer').innerHTML = '<div class="error-state">ID patient manquant</div>';
        } else {
            loadPatientDetails();
        }

        function setupModal() {
            const closeBtn = document.getElementById("modalCloseBtn");
            if (closeBtn) closeBtn.addEventListener("click", closeModal);
            const overlay = document.getElementById("modalOverlay");
            if (overlay) {
                overlay.addEventListener("click", (e) => {
                    if (e.target === overlay) closeModal();
                });
            }
        }

        function openModal(title, bodyHTML) {
            const modal = document.getElementById("modalOverlay");
            const titleEl = document.getElementById("modalTitle");
            const bodyEl = document.getElementById("modalBody");
            if (!modal || !titleEl || !bodyEl) return;
            titleEl.textContent = title;
            bodyEl.innerHTML = bodyHTML;
            modal.style.display = "flex";
            setupModal();
        }

        function closeModal() {
            const modal = document.getElementById("modalOverlay");
            if (modal) modal.style.display = "none";
        }

        function showToast(message, type) {
            const colors = { success: "#34d399", error: "#f87171", info: "#a78bfa" };
            const toast = document.createElement("div");
            toast.style.position = "fixed";
            toast.style.bottom = "24px";
            toast.style.right = "24px";
            toast.style.padding = "12px 20px";
            toast.style.borderRadius = "10px";
            toast.style.fontSize = "13px";
            toast.style.fontWeight = "600";
            toast.style.zIndex = "9999";
            toast.style.display = "flex";
            toast.style.alignItems = "center";
            toast.style.gap = "10px";
            toast.style.boxShadow = "0 4px 24px rgba(0,0,0,0.4)";
            toast.style.backgroundColor = colors[type] || colors.info;
            toast.style.color = type === 'success' ? '#0b0f1a' : '#fff';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateY(20px)";
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        async function loadPatientDetails() {
            const container = document.getElementById('patientDetailsContainer');
            try {
                const [patientRes, consultationsRes, prescriptionsRes, allergiesRes] = await Promise.all([
                    api.getPatientById(patientId).catch(() => ({ data: {} })),
                    api.getPatientConsultations(patientId).catch(() => ({ data: [] })),
                    api.getPatientPrescriptions(patientId).catch(() => ({ data: [] })),
                    api.getPatientAllergies(patientId).catch(() => ({ data: [] }))
                ]);
                currentPatient = patientRes.data || {};
                renderPatientDetails(container, currentPatient, consultationsRes.data || [], prescriptionsRes.data || [], allergiesRes.data || []);
            } catch (error) {
                container.innerHTML = `<div class="error-state">Erreur: ${error.message}</div>`;
            }
        }

        function renderPatientDetails(container, patient, consultations, prescriptions, allergies) {
            const initials = (patient.fullName || 'P').slice(0, 2).toUpperCase();
            container.innerHTML = `
                <button class="back-btn" onclick="window.location.href='doctor-dashboard.html'"><i class="fas fa-arrow-left"></i> Retour au tableau de bord</button>
                
                <div class="patient-header-card">
                    <div class="patient-avatar-large">${initials}</div>
                    <h1>${patient.fullName || 'Patient'}</h1>
                    <p>${patient.email || ''}</p>
                </div>
                
                <div class="info-grid">
                    <div class="info-card">
                        <h3><i class="fas fa-id-card"></i> Carte Chifa</h3>
                        <div class="value">${patient.chifaNumber || 'Non renseigne'}</div>
                    </div>
                    <div class="info-card">
                        <h3><i class="fas fa-phone"></i> Telephone</h3>
                        <div class="value">${patient.phoneNumber || 'Non renseigne'}</div>
                    </div>
                    <div class="info-card">
                        <h3><i class="fas fa-calendar-alt"></i> Date d'inscription</h3>
                        <div class="value">${patient.createdAt ? new Date(patient.createdAt).toLocaleDateString('fr-FR') : 'N/A'}</div>
                    </div>
                </div>

                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-allergies"></i> Allergies
                        <button class="btn-icon" style="margin-left:auto;" onclick="addAllergyFromDetails('${patient.id}')"><i class="fas fa-plus"></i></button>
                    </div>
                    ${allergies.length > 0 ? allergies.map(a => `
                        <div class="allergy-item">
                            <div style="display:flex;justify-content:space-between; align-items:center;">
                                <div>
                                    <strong>${a.allergyName}</strong>
                                    <span class="badge-pill badge-${a.severity}" style="margin-left: 10px;">${a.severity === 'mild' ? 'Legere' : a.severity === 'moderate' ? 'Moderee' : 'Severe'}</span>
                                </div>
                                <button class="btn-icon" onclick="deleteAllergyFromDetails('${a.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                            ${a.reaction ? `<div style="font-size:13px; color: var(--text-muted); margin-top:8px;">Reaction: ${a.reaction}</div>` : ''}
                        </div>
                    `).join('') : '<div style="padding: 20px 0; text-align: center; color: var(--text-muted);">Aucune allergie enregistree</div>'}
                </div>

                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-stethoscope"></i> Consultations (${consultations.length})
                        <button class="btn-icon" style="margin-left:auto;" onclick="addConsultationFromDetails('${patient.id}','${patient.fullName}')"><i class="fas fa-plus"></i></button>
                    </div>
                    ${consultations.length > 0 ? consultations.map(c => `
                        <div class="consultation-item">
                            <div style="display:flex;justify-content:space-between; margin-bottom: 8px;">
                                <strong>${new Date(c.consultationDate).toLocaleDateString('fr-FR')}</strong>
                                ${c.feePaid ? `<span style="color: var(--gold); font-weight: 600;">${c.feePaid} DA</span>` : ''}
                            </div>
                            <div><strong>Motif:</strong> ${c.chiefComplaint || '-'}</div>
                            <div><strong>Diagnostic:</strong> ${c.diagnosis || '-'}</div>
                            <div><strong>Traitement:</strong> ${c.treatmentPlan || '-'}</div>
                            ${c.notes ? `<div style="margin-top:8px; padding:10px; background:var(--surface); border-radius:var(--radius-sm);"><strong>Notes:</strong> ${c.notes}</div>` : ''}
                        </div>
                    `).join('') : '<div style="padding: 20px 0; text-align: center; color: var(--text-muted);">Aucune consultation</div>'}
                </div>

                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-pills"></i> Ordonnances (${prescriptions.length})
                        <button class="btn-icon" style="margin-left:auto;" onclick="addPrescriptionFromDetails('${patient.id}','${patient.fullName}')"><i class="fas fa-plus"></i></button>
                    </div>
                    ${prescriptions.length > 0 ? prescriptions.map(p => `
                        <div class="prescription-item">
                            <div style="display:flex;justify-content:space-between; margin-bottom: 8px;">
                                <strong>${new Date(p.prescriptionDate).toLocaleDateString('fr-FR')}</strong>
                                <span class="badge-pill ${p.isRenewable ? 'badge-mild' : 'badge-moderate'}">${p.isRenewable ? 'Renouvelable' : 'Simple'}</span>
                            </div>
                            <div><strong>Diagnostic:</strong> ${p.diagnosis || '-'}</div>
                            ${p.medications && p.medications.length > 0 ? `
                                <div style="margin-top:8px;">
                                    <strong>Medicaments:</strong>
                                    <ul style="margin-top: 6px; margin-left: 20px; color: var(--text-muted);">
                                        ${p.medications.map(m => `<li>${m.medicationName} ${m.dosage ? `- ${m.dosage}` : ''} ${m.frequency ? `(${m.frequency})` : ''}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            ${p.instructions ? `<div style="margin-top:8px; color: var(--text-muted);"><strong>Instructions:</strong> ${p.instructions}</div>` : ''}
                        </div>
                    `).join('') : '<div style="padding: 20px 0; text-align: center; color: var(--text-muted);">Aucune ordonnance</div>'}
                </div>
            `;
        }

        function addConsultationFromDetails(patientId, patientName) {
            openModal(`Nouvelle consultation`, `
                <div id="consultAlert"></div>
                <div class="form-group"><label>Motif principal</label><input class="modal-input" type="text" id="c_complaint" placeholder="Ex: Douleurs abdominales"></div>
                <div class="form-group"><label>Diagnostic</label><textarea class="modal-input" id="c_diagnosis" rows="3" placeholder="Diagnostic..."></textarea></div>
                <div class="form-group"><label>Traitement</label><textarea class="modal-input" id="c_treatment" rows="3" placeholder="Traitement prescrit..."></textarea></div>
                <div class="form-group"><label>Notes</label><textarea class="modal-input" id="c_notes" rows="2" placeholder="Notes supplementaires..."></textarea></div>
                <div class="form-group"><label>Honoraires (DA)</label><input class="modal-input" type="number" id="c_fee" placeholder="3000"></div>
                <div class="modal-actions"><button class="btn-cancel-modal" onclick="closeModal()">Annuler</button><button class="btn-save-modal" onclick="saveConsultationFromDetails('${patientId}')">Enregistrer</button></div>
            `);
        }

        async function saveConsultationFromDetails(patientId) {
            const alertEl = document.getElementById("consultAlert");
            const chiefComplaint = document.getElementById("c_complaint").value.trim();
            if (!chiefComplaint) { alertEl.innerHTML = `<div class="alert-error">Le motif principal est obligatoire</div>`; return; }
            try {
                await api.createConsultation({ 
                    patientId, 
                    chiefComplaint, 
                    diagnosis: document.getElementById("c_diagnosis").value.trim(), 
                    treatmentPlan: document.getElementById("c_treatment").value.trim(), 
                    notes: document.getElementById("c_notes").value.trim(), 
                    feePaid: parseFloat(document.getElementById("c_fee").value) || null 
                });
                closeModal(); 
                showToast("Consultation ajoutee", "success"); 
                setTimeout(() => location.reload(), 1000);
            } catch(e) { 
                alertEl.innerHTML = `<div class="alert-error">${e.message}</div>`; 
            }
        }

        function addPrescriptionFromDetails(patientId, patientName) {
            openModal(`Nouvelle ordonnance`, `
                <div id="prescAlert"></div>
                <div class="form-group"><label>Diagnostic</label><input class="modal-input" type="text" id="p_diagnosis" placeholder="Diagnostic..."></div>
                <div id="medicationsList">${medicationRow()}</div>
                <button class="btn-add-med" onclick="addMedicationRow()">+ Ajouter un medicament</button>
                <div class="form-group"><label>Instructions</label><textarea class="modal-input" id="p_instructions" rows="2" placeholder="Instructions generales..."></textarea></div>
                <div class="form-group"><label>Renouvelable</label><select class="modal-input" id="p_renewable"><option value="false">Non</option><option value="true">Oui</option></select></div>
                <div class="modal-actions"><button class="btn-cancel-modal" onclick="closeModal()">Annuler</button><button class="btn-save-modal" onclick="savePrescriptionFromDetails('${patientId}')">Enregistrer</button></div>
            `);
        }

        function medicationRow() {
            return `<div class="medication-row">
                <input class="med-input med-name" placeholder="Medicament">
                <input class="med-input med-dosage" placeholder="Dosage">
                <input class="med-input med-frequency" placeholder="Frequence">
                <input class="med-input med-duration" placeholder="Duree (jours)">
                <button class="btn-remove-med" onclick="this.closest('.medication-row').remove()"><i class="fas fa-trash"></i></button>
            </div>`;
        }

        function addMedicationRow() {
            document.getElementById('medicationsList').insertAdjacentHTML('beforeend', medicationRow());
        }

        async function savePrescriptionFromDetails(patientId) {
            const alertEl = document.getElementById("prescAlert");
            const rows = document.querySelectorAll(".medication-row");
            const medications = [];
            rows.forEach(row => { 
                const name = row.querySelector(".med-name")?.value.trim(); 
                if(name) medications.push({ 
                    name, 
                    dosage: row.querySelector(".med-dosage")?.value, 
                    frequency: row.querySelector(".med-frequency")?.value, 
                    durationDays: row.querySelector(".med-duration")?.value 
                }); 
            });
            if(!medications.length) { 
                alertEl.innerHTML = `<div class="alert-error">Ajoutez au moins un medicament</div>`; 
                return; 
            }
            try {
                await api.createPrescription({ 
                    patientId, 
                    diagnosis: document.getElementById("p_diagnosis").value.trim(), 
                    medications, 
                    instructions: document.getElementById("p_instructions").value.trim(), 
                    isRenewable: document.getElementById("p_renewable").value === 'true' 
                });
                closeModal(); 
                showToast("Ordonnance ajoutee", "success"); 
                setTimeout(() => location.reload(), 1000);
            } catch(e) { 
                alertEl.innerHTML = `<div class="alert-error">${e.message}</div>`; 
            }
        }

        function addAllergyFromDetails(patientId) {
            openModal(`Ajouter une allergie`, `
                <div id="allergyAlert"></div>
                <div class="form-group"><label>Nom de l'allergie</label><input class="modal-input" type="text" id="a_name" placeholder="Ex: Penicilline"></div>
                <div class="form-group"><label>Type</label><select class="modal-input" id="a_type"><option value="medication">Medicament</option><option value="food">Aliment</option><option value="environmental">Environnemental</option></select></div>
                <div class="form-group"><label>Severite</label><select class="modal-input" id="a_severity"><option value="mild">Legere</option><option value="moderate">Moderee</option><option value="severe">Severe</option></select></div>
                <div class="form-group"><label>Reaction</label><textarea class="modal-input" id="a_reaction" rows="2" placeholder="Description de la reaction..."></textarea></div>
                <div class="modal-actions"><button class="btn-cancel-modal" onclick="closeModal()">Annuler</button><button class="btn-save-modal" onclick="saveAllergyFromDetails('${patientId}')">Enregistrer</button></div>
            `);
        }

        async function saveAllergyFromDetails(patientId) {
            const alertEl = document.getElementById("allergyAlert");
            const name = document.getElementById("a_name").value.trim();
            if(!name) { 
                alertEl.innerHTML = `<div class="alert-error">Le nom de l'allergie est obligatoire</div>`; 
                return; 
            }
            try {
                await api.createAllergy(patientId, { 
                    allergyName: name, 
                    allergyType: document.getElementById("a_type").value, 
                    severity: document.getElementById("a_severity").value, 
                    reaction: document.getElementById("a_reaction").value.trim() 
                });
                closeModal(); 
                showToast("Allergie ajoutee", "success"); 
                setTimeout(() => location.reload(), 1000);
            } catch(e) { 
                alertEl.innerHTML = `<div class="alert-error">${e.message}</div>`; 
            }
        }

        async function deleteAllergyFromDetails(allergyId) {
            if(!confirm("Supprimer cette allergie ?")) return;
            try { 
                await api.deleteAllergy(allergyId); 
                showToast("Allergie supprimee", "success"); 
                setTimeout(() => location.reload(), 1000);
            } catch(e) { 
                showToast("Erreur lors de la suppression", "error"); 
            }
        }

        window.addConsultationFromDetails = addConsultationFromDetails;
        window.saveConsultationFromDetails = saveConsultationFromDetails;
        window.addPrescriptionFromDetails = addPrescriptionFromDetails;
        window.savePrescriptionFromDetails = savePrescriptionFromDetails;
        window.addAllergyFromDetails = addAllergyFromDetails;
        window.saveAllergyFromDetails = saveAllergyFromDetails;
        window.deleteAllergyFromDetails = deleteAllergyFromDetails;
        window.closeModal = closeModal;
        window.addMedicationRow = addMedicationRow;
    </script>
</body>
</html>
