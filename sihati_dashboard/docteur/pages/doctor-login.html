<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Médecin - Sihati</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/design-system.css">
    
    <style>
        body {
            min-height: 100vh;
            background: #0f172a;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Animated Background */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
        
        .bg-animated::before,
        .bg-animated::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            animation: float 20s infinite ease-in-out;
        }
        
        .bg-animated::before {
            width: 600px;
            height: 600px;
            background: #2E7BF6;
            top: -300px;
            right: -250px;
        }
        
        .bg-animated::after {
            width: 500px;
            height: 500px;
            background: #00BFA5;
            bottom: -250px;
            left: -200px;
            animation-delay: -10s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 40px) scale(0.9); }
        }
        
        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }
        
        .theme-toggle i {
            font-size: 24px;
            color: #fbbf24;
        }
        
        /* Back Button */
        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateX(-4px);
        }
        
        /* Container */
        .login-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .login-box {
            max-width: 480px;
            width: 100%;
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(46, 123, 246, 0.3);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }
        
        .logo i {
            font-size: 40px;
            color: #2E7BF6;
        }
        
        .login-title {
            font-size: 2rem;
            font-weight: 800;
            color: white;
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }
        
        /* Form Card */
        .form-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }
        
        /* Error Box */
        .error-box {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            color: #fca5a5;
            font-size: 0.9rem;
            align-items: center;
            gap: 12px;
        }
        
        .error-box i {
            font-size: 20px;
            color: #ef4444;
        }
        
        /* Form Group */
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .form-input {
            width: 100%;
            height: 56px;
            padding: 0 16px 0 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #2E7BF6;
            box-shadow: 0 0 0 4px rgba(46, 123, 246, 0.1);
        }
        
        .form-input::placeholder {
            color: #64748b;
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #2E7BF6;
            font-size: 20px;
        }
        
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
            transition: color 0.3s;
        }
        
        .toggle-password:hover {
            color: #2E7BF6;
        }
        
        /* Options Row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2E7BF6;
        }
        
        .forgot-link {
            color: #2E7BF6;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .forgot-link:hover {
            color: #5B9BFF;
        }
        
        /* Submit Button */
        .submit-btn {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, #2E7BF6, #1E5BC6);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(46, 123, 246, 0.3);
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(46, 123, 246, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .divider-text {
            color: #64748b;
            font-size: 0.85rem;
        }
        
        /* Register Link */
        .register-section {
            text-align: center;
        }
        
        .register-link {
            display: block;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .register-link:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #2E7BF6;
            color: #2E7BF6;
        }
        
        /* Light Theme */
        body[data-theme="light"] {
            background: #F9FAFB;
        }
        
        body[data-theme="light"] .bg-animated {
            background: linear-gradient(135deg, #F9FAFB 0%, #E8F2FF 50%, #F9FAFB 100%);
        }
        
        body[data-theme="light"] .bg-animated::before,
        body[data-theme="light"] .bg-animated::after {
            opacity: 0.08;
        }
        
        body[data-theme="light"] .theme-toggle {
            background: rgba(46, 123, 246, 0.1);
            border-color: rgba(46, 123, 246, 0.2);
        }
        
        body[data-theme="light"] .theme-toggle i {
            color: #1e40af;
        }
        
        body[data-theme="light"] .back-btn {
            background: rgba(46, 123, 246, 0.1);
            border-color: rgba(46, 123, 246, 0.2);
            color: #0f172a;
        }
        
        body[data-theme="light"] .logo {
            background: rgba(46, 123, 246, 0.05);
        }
        
        body[data-theme="light"] .login-title {
            color: #0f172a;
        }
        
        body[data-theme="light"] .login-subtitle {
            color: #64748b;
        }
        
        body[data-theme="light"] .form-card {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(46, 123, 246, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        
        body[data-theme="light"] .form-label {
            color: #475569;
        }
        
        body[data-theme="light"] .form-input {
            background: rgba(241, 245, 249, 0.8);
            border-color: #e2e8f0;
            color: #0f172a;
        }
        
        body[data-theme="light"] .form-input::placeholder {
            color: #94a3b8;
        }
        
        body[data-theme="light"] .remember-me {
            color: #475569;
        }
        
        body[data-theme="light"] .divider-text {
            color: #94a3b8;
        }
        
        body[data-theme="light"] .register-link {
            background: rgba(241, 245, 249, 0.8);
            border-color: #e2e8f0;
            color: #0f172a;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .form-card {
                padding: 32px 24px;
            }
            
            .back-btn {
                position: static;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>
    
    <!-- Back Button -->
    <a href="D:\memoire/index.html" class="back-btn">
        <i class="bi bi-arrow-left"></i>
        Retour
    </a>
    
    <!-- Animated Background -->
    <div class="bg-animated"></div>
    
    <!-- Login Container -->
    <div class="login-container">
        <div class="login-box">
            
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo">
    <img src="D:\memoire\icons/sihati_icon_white.svg" alt="Sihati" style="width: 70px; height: 70px;">
</div>
                <h1 class="login-title">Portail Médecin</h1>
                <p class="login-subtitle">Connectez-vous à votre espace Sihati</p>
            </div>
            
            <!-- Form Card -->
            <div class="form-card">
                
                <!-- Error Message -->
                <div id="errorMessage" class="error-box">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span id="errorText"></span>
                </div>
                
                <!-- Login Form -->
                <form id="loginForm">
                    
                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label">Adresse email</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope input-icon"></i>
                            <input 
                                type="email" 
                                class="form-input" 
                                id="emailInput"
                                placeholder="docteur@clinique.dz"
                                required
                            >
                        </div>
                    </div>
                    
                    <!-- Password -->
                    <div class="form-group">
                        <label class="form-label">Mot de passe</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input 
                                type="password" 
                                class="form-input" 
                                id="passwordInput"
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Options -->
                    <div class="options-row">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Se souvenir de moi</span>
                        </label>
                        <a href="#" class="forgot-link">Mot de passe oublié ?</a>
                    </div>
                    
                    <!-- Submit -->
                    <button type="submit" class="submit-btn" id="loginButton">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span id="loginButtonText">Se connecter</span>
                    </button>
                    
                </form>
                
                <!-- Divider -->
                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">Nouveau sur Sihati ?</span>
                    <div class="divider-line"></div>
                </div>
                
                <!-- Register Link -->
                <div class="register-section">
                    <a href="doctor-register.html" class="register-link">
                        <i class="bi bi-person-plus"></i> Créer un compte médecin
                    </a>
                </div>
                
            </div>
            
        </div>
    </div>
    
    <script src="../js/doctor/config.js"></script>
<script src="../js/doctor/mock-api.js"></script>
<script src="../js/doctor/utils/api.js"></script>
<script src="../js/doctor/doctor-auth.js"></script>
<script src="../js/doctor/utils/validator.js"></script>
    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;
        
        const savedTheme = localStorage.getItem('theme') || 'dark';
        body.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });
        
        function updateIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
        }
        
        // Toggle Password
        document.getElementById('togglePassword').addEventListener('click', function() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
        
        // Form Submit
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            document.getElementById('errorMessage').style.display = 'none';
            
            const validation = Validator.validateLoginForm(email, password);
            if (!validation.isValid) {
                document.getElementById('errorMessage').style.display = 'flex';
                document.getElementById('errorText').textContent = 
                    validation.errors.email || validation.errors.password;
                return;
            }
            
            const loginButton = document.getElementById('loginButton');
            const loginButtonText = document.getElementById('loginButtonText');
            loginButton.disabled = true;
            loginButtonText.textContent = 'Connexion...';
            
            try {
                const response = await API.post(CONFIG.ENDPOINTS.AUTH.LOGIN, {
                    email: email,
                    password: password,
                    userType: 'doctor'
                });
                
                Auth.saveToken(response.token);
                Auth.saveUser(response.user);
                localStorage.setItem('doctor_data', JSON.stringify(response.doctor));
                
                window.location.href = 'doctor-dashboard.html';
                
            } catch (error) {
                document.getElementById('errorMessage').style.display = 'flex';
                document.getElementById('errorText').textContent = 
                    error.message || 'Email ou mot de passe incorrect';
                loginButton.disabled = false;
                loginButtonText.textContent = 'Se connecter';
            }
        });
    </script>
</body>
</html>
