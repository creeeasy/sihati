<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Médecin - Sihati</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════
           DESIGN SYSTEM TOKENS — SIHATI APPCOLORS
        ═══════════════════════════════════════════ */
        :root {
            --primary:        #2E7BF6;
            --primary-dark:   #1E5BC6;
            --primary-light:  #5B9BFF;
            --primary-soft:   #E8F2FF;

            --secondary:      #00BFA5;
            --secondary-dark: #00897B;
            --secondary-light:#64FFDA;
            --secondary-soft: #E0F7F4;

            --accent:         #FF6B35;
            --accent-soft:    #FFEDE8;

            --success:        #10B981;
            --success-dark:   #059669;
            --success-light:  #D1FAE5;
            --warning:        #F59E0B;
            --error:          #EF4444;
            --error-dark:     #DC2626;
            --error-light:    #FEE2E2;
            --info:           #3B82F6;

            --text-primary:   #1F2937;
            --text-secondary: #6B7280;
            --text-tertiary:  #9CA3AF;
            --text-disabled:  #D1D5DB;
            --background:     #F9FAFB;
            --surface:        #FFFFFF;
            --border:         #E5E7EB;
            --divider:        #F3F4F6;
        }

        body[data-theme="dark"] {
            --background:     #0f172a;
            --surface:        #1e293b;
            --text-primary:   #F1F5F9;
            --text-secondary: #94a3b8;
            --text-tertiary:  #64748b;
            --border:         rgba(255,255,255,0.08);
            --divider:        rgba(255,255,255,0.04);
            --primary-soft:   rgba(46,123,246,0.12);
            --secondary-soft: rgba(0,191,165,0.12);
            --success-light:  rgba(16,185,129,0.12);
            --error-light:    rgba(239,68,68,0.12);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            background: var(--background);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.4s, color 0.4s;
        }

        /* ═══════════════════════════════════════════
           BACKGROUND
        ═══════════════════════════════════════════ */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .bg-mesh::before {
            content: '';
            position: absolute;
            width: 550px; height: 550px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            top: -200px; right: -160px;
            opacity: 0.10;
            border-radius: 50%;
            animation: drift1 20s ease-in-out infinite;
        }
        .bg-mesh::after {
            content: '';
            position: absolute;
            width: 450px; height: 450px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            bottom: -140px; left: -120px;
            opacity: 0.10;
            border-radius: 50%;
            animation: drift2 25s ease-in-out infinite;
        }
        body[data-theme="dark"] .bg-mesh::before { opacity: 0.18; }
        body[data-theme="dark"] .bg-mesh::after  { opacity: 0.14; }

        @keyframes drift1 {
            0%,100% { transform: translate(0,0); }
            50%      { transform: translate(-40px, 30px); }
        }
        @keyframes drift2 {
            0%,100% { transform: translate(0,0); }
            50%      { transform: translate(50px, -40px); }
        }

        /* ═══════════════════════════════════════════
           FIXED CONTROLS
        ═══════════════════════════════════════════ */
        .theme-toggle {
            position: fixed;
            top: 24px; right: 24px;
            z-index: 1000;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: var(--surface);
            border: 1.5px solid var(--border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .theme-toggle:hover {
            transform: scale(1.08);
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(46,123,246,0.18);
        }
        .theme-toggle i {
            font-size: 20px;
            color: var(--warning);
            transition: transform 0.3s, color 0.3s;
        }
        body[data-theme="dark"] .theme-toggle i { color: var(--primary-light); }
        .theme-toggle:hover i { transform: rotate(18deg); }

        .back-btn {
            position: fixed;
            top: 24px; left: 24px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            transition: all 0.3s;
        }
        .back-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary-dark);
            transform: translateX(-4px);
        }
        body[data-theme="dark"] .back-btn:hover { color: var(--secondary-light); }

        /* ═══════════════════════════════════════════
           LAYOUT
        ═══════════════════════════════════════════ */
        .register-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 100px 24px 60px;
        }

        .register-box {
            max-width: 780px;
            width: 100%;
            animation: slideUp 0.65s cubic-bezier(0.4,0,0.2,1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════════════
           LOGO SECTION
        ═══════════════════════════════════════════ */
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-wrap {
            width: 80px; height: 80px;
            border-radius: 22px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            box-shadow: 0 6px 24px rgba(0,191,165,0.12);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .logo-wrap:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0,191,165,0.2);
        }
        .logo-wrap::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .logo-wrap:hover::after { opacity: 1; }
        .logo-wrap i {
            font-size: 36px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .register-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* ═══════════════════════════════════════════
           STEPS INDICATOR
        ═══════════════════════════════════════════ */
        .steps-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .step { display: flex; align-items: center; gap: 10px; }

        .step-number {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--divider);
            border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-tertiary);
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.35s ease;
        }

        .step.active .step-number {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,191,165,0.28);
        }
        .step.completed .step-number {
            background: var(--success-light);
            border-color: var(--success);
            color: var(--success-dark);
        }
        body[data-theme="dark"] .step.completed .step-number {
            background: rgba(16,185,129,0.2);
            color: var(--success);
        }

        .step-label {
            color: var(--text-tertiary);
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.3s;
        }
        .step.active .step-label { color: var(--text-primary); }
        .step.completed .step-label { color: var(--success-dark); }
        body[data-theme="dark"] .step.completed .step-label { color: var(--success); }

        .step-divider {
            width: 56px;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
            transition: background 0.3s;
        }
        .step-divider.done { background: var(--success); }

        /* ═══════════════════════════════════════════
           FORM CARD
        ═══════════════════════════════════════════ */
        .form-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }
        body[data-theme="dark"] .form-card {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.07);
            box-shadow: none;
        }

        /* Step forms */
        .step-form { display: none; }
        .step-form.active {
            display: block;
            animation: stepIn 0.3s ease-out;
        }
        @keyframes stepIn {
            from { opacity: 0; transform: translateX(12px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .step-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .step-title i {
            font-size: 22px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Messages */
        .error-box, .success-box {
            display: none;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 22px;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
        }
        .error-box {
            background: var(--error-light);
            border: 1px solid rgba(239,68,68,0.25);
            color: var(--error-dark);
        }
        .success-box {
            background: var(--success-light);
            border: 1px solid rgba(16,185,129,0.25);
            color: var(--success-dark);
        }
        body[data-theme="dark"] .error-box { color: #fca5a5; }
        body[data-theme="dark"] .success-box { color: #6ee7b7; }
        .error-box i { color: var(--error); font-size: 18px; flex-shrink: 0; }
        .success-box i { color: var(--success); font-size: 18px; flex-shrink: 0; }

        /* Form groups */
        .form-group { margin-bottom: 20px; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .input-wrapper { position: relative; }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0 16px;
            background: var(--divider);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s;
        }
        body[data-theme="dark"] .form-input,
        body[data-theme="dark"] .form-select,
        body[data-theme="dark"] .form-textarea {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.08);
        }

        .form-input, .form-select { height: 52px; }

        .form-textarea {
            padding: 14px 16px;
            min-height: 100px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            background: var(--surface);
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(0,191,165,0.12);
        }
        body[data-theme="dark"] .form-input:focus,
        body[data-theme="dark"] .form-select:focus,
        body[data-theme="dark"] .form-textarea:focus {
            background: rgba(255,255,255,0.07);
        }

        .form-input::placeholder,
        .form-textarea::placeholder { color: var(--text-tertiary); }

        .form-select option {
            background: var(--surface);
            color: var(--text-primary);
        }
        body[data-theme="dark"] .form-select option {
            background: #1e293b;
            color: #F1F5F9;
        }

        .toggle-password {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--secondary); }

        /* Checkbox */
        .form-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .form-check input {
            width: 17px; height: 17px;
            accent-color: var(--secondary);
            cursor: pointer;
        }
        .form-check label {
            color: var(--text-secondary);
            font-size: 0.88rem;
            cursor: pointer;
        }
        .form-check a { color: var(--secondary); text-decoration: none; font-weight: 600; }
        .form-check a:hover { color: var(--secondary-dark); }

        /* Availability */
        .availability-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .day-item {
            background: var(--divider);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.3s;
        }
        body[data-theme="dark"] .day-item {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.07);
        }
        .day-item.active {
            border-color: var(--secondary);
            background: var(--secondary-soft);
        }
        body[data-theme="dark"] .day-item.active {
            background: rgba(0,191,165,0.08);
            border-color: rgba(0,191,165,0.35);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .day-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .day-item.active .day-name { color: var(--secondary-dark); }
        body[data-theme="dark"] .day-item.active .day-name { color: var(--secondary-light); }

        /* Toggle switch */
        .day-toggle {
            width: 44px; height: 22px;
            background: var(--border);
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            border: none;
            flex-shrink: 0;
        }
        .day-toggle.active { background: var(--secondary); }
        .day-toggle::after {
            content: '';
            position: absolute;
            width: 16px; height: 16px;
            background: white;
            border-radius: 50%;
            top: 3px; left: 3px;
            transition: left 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        .day-toggle.active::after { left: 25px; }

        .day-times {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .day-times input {
            flex: 1;
            height: 38px;
            padding: 0 10px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s;
        }
        body[data-theme="dark"] .day-times input {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        .day-times input:focus {
            outline: none;
            border-color: var(--secondary);
        }
        .day-times input:disabled { opacity: 0.35; cursor: not-allowed; }
        .day-times span { color: var(--text-tertiary); font-size: 13px; }

        /* Hint text */
        .hint {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--primary-soft);
            border: 1px solid rgba(46,123,246,0.15);
            border-radius: 12px;
            color: var(--primary-dark);
            font-size: 0.85rem;
            margin-bottom: 22px;
        }
        body[data-theme="dark"] .hint {
            background: rgba(46,123,246,0.10);
            border-color: rgba(46,123,246,0.2);
            color: var(--primary-light);
        }
        .hint i { flex-shrink: 0; }

        /* Buttons */
        .btn {
            height: 50px;
            padding: 0 28px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: #fff;
            box-shadow: 0 6px 20px rgba(0,191,165,0.28);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0,191,165,0.38);
        }

        .btn-secondary {
            background: var(--divider);
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-secondary:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        body[data-theme="dark"] .btn-secondary {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
            color: var(--text-secondary);
        }
        body[data-theme="dark"] .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .btn-actions {
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1.5px solid var(--border);
        }

        /* Login link bottom */
        .login-link {
            text-align: center;
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .login-link p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0;
        }
        .login-link a {
            color: var(--secondary);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-link a:hover { color: var(--secondary-dark); }
        body[data-theme="dark"] .login-link a:hover { color: var(--secondary-light); }

        @media (max-width: 768px) {
            .form-row,
            .availability-grid { grid-template-columns: 1fr; }
            .form-card { padding: 28px 20px; }
            .steps-indicator { gap: 6px; }
            .step-label { display: none; }
            .step-divider { width: 28px; }
            .btn-actions { flex-direction: column-reverse; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" aria-label="Changer le thème">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>

    <a href="doctor-login.html" class="back-btn">
        <i class="bi bi-arrow-left"></i> Retour
    </a>

    <div class="bg-mesh"></div>

    <div class="register-container">
        <div class="register-box">

            <!-- Logo -->
            <div class="logo-section">
                <div class="logo-wrap">
                    <i class="bi bi-person-badge-fill"></i>
                </div>
                <h1 class="register-title">Créer un compte médecin</h1>
                <p class="register-subtitle">Rejoignez Sihati en quelques étapes</p>
            </div>

            <!-- Steps Indicator -->
            <div class="steps-indicator">
                <div class="step active" id="step1Indicator">
                    <div class="step-number">1</div>
                    <div class="step-label">Compte</div>
                </div>
                <div class="step-divider" id="divider1"></div>
                <div class="step" id="step2Indicator">
                    <div class="step-number">2</div>
                    <div class="step-label">Profil</div>
                </div>
                <div class="step-divider" id="divider2"></div>
                <div class="step" id="step3Indicator">
                    <div class="step-number">3</div>
                    <div class="step-label">Disponibilités</div>
                </div>
            </div>

            <!-- Form Card -->
            <div class="form-card">

                <div id="errorMessage" class="error-box">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span id="errorText"></span>
                </div>
                <div id="successMessage" class="success-box">
                    <i class="bi bi-check-circle-fill"></i>
                    <span id="successText"></span>
                </div>

                <!-- STEP 1 -->
                <div class="step-form active" id="stepForm1">
                    <div class="step-title">
                        <i class="bi bi-person-circle"></i> Informations du compte
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Prénom</label>
                            <input type="text" class="form-input" id="firstName" placeholder="Ahmed">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nom</label>
                            <input type="text" class="form-input" id="lastName" placeholder="Benali">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Adresse email</label>
                        <input type="email" class="form-input" id="email" placeholder="docteur@clinique.dz">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Mot de passe</label>
                            <div class="input-wrapper">
                                <input type="password" class="form-input" id="password" placeholder="••••••••">
                                <button type="button" class="toggle-password" id="togglePassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirmer le mot de passe</label>
                            <div class="input-wrapper">
                                <input type="password" class="form-input" id="confirmPassword" placeholder="••••••••">
                                <button type="button" class="toggle-password" id="toggleConfirmPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="terms">
                        <label for="terms">
                            J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a>
                        </label>
                    </div>

                    <div class="btn-actions">
                        <button class="btn btn-primary" id="nextStep1Btn">
                            Suivant <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <!-- STEP 2 -->
                <div class="step-form" id="stepForm2">
                    <div class="step-title">
                        <i class="bi bi-person-badge"></i> Informations professionnelles
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Spécialité</label>
                            <select class="form-select" id="specialty">
                                <option value="">Sélectionner une spécialité</option>
                                <option value="general">Médecin Généraliste</option>
                                <option value="cardio">Cardiologue</option>
                                <option value="dermato">Dermatologue</option>
                                <option value="pediatre">Pédiatre</option>
                                <option value="gyneco">Gynécologue</option>
                                <option value="ortho">Orthopédiste</option>
                                <option value="ophtalmo">Ophtalmologue</option>
                                <option value="pneumo">Pneumologue</option>
                                <option value="neuro">Neurologue</option>
                                <option value="gastro">Gastro-entérologue</option>
                                <option value="urologie">Urologue</option>
                                <option value="psychiatrie">Psychiatre</option>
                                <option value="rhumato">Rhumatologue</option>
                                <option value="endocrino">Endocrinologue</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Numéro de licence</label>
                            <input type="text" class="form-input" id="licenseNumber" placeholder="MED-2024-001">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Wilaya</label>
                            <select class="form-select" id="wilaya">
                                <option value="">Sélectionner une wilaya</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Commune</label>
                            <input type="text" class="form-input" id="commune" placeholder="Votre commune">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Téléphone</label>
                            <input type="tel" class="form-input" id="phone" placeholder="043 12 34 56">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Adresse du cabinet</label>
                            <input type="text" class="form-input" id="address" placeholder="Rue, numéro...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Bio / Description</label>
                        <textarea class="form-textarea" id="bio"
                            placeholder="Décrivez votre expérience, vos spécialités, votre approche..."></textarea>
                    </div>

                    <div class="btn-actions">
                        <button class="btn btn-secondary" id="backStep2Btn">
                            <i class="bi bi-arrow-left"></i> Retour
                        </button>
                        <button class="btn btn-primary" id="nextStep2Btn">
                            Suivant <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <!-- STEP 3 -->
                <div class="step-form" id="stepForm3">
                    <div class="step-title">
                        <i class="bi bi-calendar-week"></i> Vos disponibilités
                    </div>

                    <div class="hint">
                        <i class="bi bi-info-circle-fill"></i>
                        Activez les jours où vous consultez et définissez vos horaires.
                    </div>

                    <div class="availability-grid" id="availabilityGrid"></div>

                    <div class="btn-actions">
                        <button class="btn btn-secondary" id="backStep3Btn">
                            <i class="bi bi-arrow-left"></i> Retour
                        </button>
                        <button class="btn btn-primary" id="submitBtn">
                            <i class="bi bi-check-circle-fill"></i>
                            <span id="submitBtnText">Créer mon compte</span>
                        </button>
                    </div>
                </div>

                <!-- Login link -->
                <div class="login-link">
                    <p>Vous avez déjà un compte ?</p>
                    <a href="doctor-login.html">Se connecter</a>
                </div>

            </div>

        </div>
    </div>

    <script src="../js/doctor/config.js"></script>
    <script src="../js/doctor/mock-api.js"></script>
    <script src="../js/doctor/utils/api.js"></script>
    <script src="../js/doctor/doctor-auth.js"></script>
    <script src="../js/doctor/utils/validator.js"></script>
    <script>
        // ── THEME ──────────────────────────────────────────────
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon   = document.getElementById('themeIcon');
        const body        = document.body;

        const saved = localStorage.getItem('sihati-theme') || 'light';
        applyTheme(saved);

        themeToggle.addEventListener('click', () => {
            const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            localStorage.setItem('sihati-theme', next);
        });

        function applyTheme(theme) {
            body.setAttribute('data-theme', theme);
            themeIcon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
        }

        // ── WILAYAS ────────────────────────────────────────────
        const wilayaSelect = document.getElementById('wilaya');
        const defaultWilayas = [
            "Adrar","Chlef","Laghouat","Oum El Bouaghi","Batna","Béjaïa","Biskra","Béchar","Blida",
            "Bouira","Tamanrasset","Tébessa","Tlemcen","Tiaret","Tizi Ouzou","Alger","Djelfa","Jijel",
            "Sétif","Saïda","Skikda","Sidi Bel Abbès","Annaba","Guelma","Constantine","Médéa","Mostaganem",
            "M'Sila","Mascara","Ouargla","Oran","El Bayadh","Illizi","Bordj Bou Arreridj","Boumerdès",
            "El Tarf","Tindouf","Tissemsilt","El Oued","Khenchela","Souk Ahras","Tipaza","Mila","Aïn Defla",
            "Naâma","Aïn Témouchent","Ghardaïa","Relizane","Timimoun","Bordj Badji Mokhtar","Ouled Djellal",
            "Béni Abbès","In Salah","In Guezzam","Touggourt","Djanet","El M'Ghair","El Menia"
        ];
        const wilayas = (typeof CONFIG !== 'undefined' && CONFIG.WILAYAS?.length) ? CONFIG.WILAYAS : defaultWilayas;
        wilayas.forEach(w => {
            const o = document.createElement('option');
            o.value = w; o.textContent = w;
            wilayaSelect.appendChild(o);
        });

        // ── PASSWORD TOGGLES ───────────────────────────────────
        function setupPasswordToggle(btnId, inputId) {
            const btn   = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (!btn || !input) return;
            btn.addEventListener('click', function () {
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.replace('bi-eye', 'bi-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.replace('bi-eye-slash', 'bi-eye');
                }
            });
        }
        setupPasswordToggle('togglePassword', 'password');
        setupPasswordToggle('toggleConfirmPassword', 'confirmPassword');

        // ── AVAILABILITY GRID ──────────────────────────────────
        const daysConfig = [
            { id:'monday',    name:'Lundi',    open:'08:00', close:'17:00', active:true  },
            { id:'tuesday',   name:'Mardi',    open:'08:00', close:'17:00', active:true  },
            { id:'wednesday', name:'Mercredi', open:'08:00', close:'17:00', active:true  },
            { id:'thursday',  name:'Jeudi',    open:'08:00', close:'17:00', active:true  },
            { id:'friday',    name:'Vendredi', open:'08:00', close:'12:00', active:false },
            { id:'saturday',  name:'Samedi',   open:'08:00', close:'12:00', active:false },
            { id:'sunday',    name:'Dimanche', open:'08:00', close:'12:00', active:false }
        ];

        function buildGrid() {
            const grid = document.getElementById('availabilityGrid');
            grid.innerHTML = '';
            daysConfig.forEach(day => {
                const el = document.createElement('div');
                el.className = `day-item ${day.active ? 'active' : ''}`;
                el.id = `dayItem-${day.id}`;
                el.innerHTML = `
                    <div class="day-header">
                        <span class="day-name">${day.name}</span>
                        <button type="button" class="day-toggle ${day.active ? 'active' : ''}" data-day="${day.id}"></button>
                    </div>
                    <div class="day-times">
                        <input type="time" class="day-open" value="${day.open}" ${!day.active ? 'disabled' : ''}>
                        <span>à</span>
                        <input type="time" class="day-close" value="${day.close}" ${!day.active ? 'disabled' : ''}>
                    </div>`;
                grid.appendChild(el);
            });

            document.querySelectorAll('.day-toggle').forEach(toggle => {
                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    this.classList.toggle('active');
                    const active  = this.classList.contains('active');
                    const dayItem = document.getElementById(`dayItem-${this.dataset.day}`);
                    dayItem.classList.toggle('active', active);
                    dayItem.querySelectorAll('input[type="time"]').forEach(i => i.disabled = !active);
                });
            });
        }
        buildGrid();

        // ── STEPS ──────────────────────────────────────────────
        let currentStep = 1;

        function updateStepIndicators(step) {
            for (let i = 1; i <= 3; i++) {
                const ind     = document.getElementById(`step${i}Indicator`);
                const numDiv  = ind.querySelector('.step-number');
                const divider = document.getElementById(`divider${i}`);

                if (i < step) {
                    ind.classList.add('completed');
                    ind.classList.remove('active');
                    numDiv.innerHTML = '<i class="bi bi-check"></i>';
                    if (divider) divider.classList.add('done');
                } else if (i === step) {
                    ind.classList.add('active');
                    ind.classList.remove('completed');
                    numDiv.innerHTML = i;
                } else {
                    ind.classList.remove('active', 'completed');
                    numDiv.innerHTML = i;
                    if (divider) divider.classList.remove('done');
                }
            }
        }

        function showStep(step) {
            document.querySelectorAll('.step-form').forEach(f => f.classList.remove('active'));
            document.getElementById(`stepForm${step}`).classList.add('active');
            updateStepIndicators(step);
            currentStep = step;
            hideMessages();
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display   = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }
        function showError(msg) {
            const box = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = msg;
            box.style.display = 'flex';
        }
        function showSuccess(msg) {
            const box = document.getElementById('successMessage');
            document.getElementById('successText').textContent = msg;
            box.style.display = 'flex';
        }

        // Step 1
        document.getElementById('nextStep1Btn').addEventListener('click', () => {
            hideMessages();
            const firstName       = document.getElementById('firstName').value.trim();
            const lastName        = document.getElementById('lastName').value.trim();
            const email           = document.getElementById('email').value.trim();
            const password        = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms           = document.getElementById('terms').checked;

            if (!firstName) { showError('Le prénom est requis'); return; }
            if (!lastName)  { showError('Le nom est requis'); return; }
            if (!email)     { showError("L'email est requis"); return; }
            if (typeof Validator !== 'undefined' && !Validator.isValidEmail(email)) { showError('Email invalide'); return; }
            if (!password)  { showError('Le mot de passe est requis'); return; }
            if (password.length < 6) { showError('Minimum 6 caractères'); return; }
            if (password !== confirmPassword) { showError('Les mots de passe ne correspondent pas'); return; }
            if (!terms) { showError("Vous devez accepter les conditions d'utilisation"); return; }
            showStep(2);
        });

        // Step 2
        document.getElementById('backStep2Btn').addEventListener('click', () => showStep(1));
        document.getElementById('nextStep2Btn').addEventListener('click', () => {
            hideMessages();
            const specialty     = document.getElementById('specialty').value;
            const licenseNumber = document.getElementById('licenseNumber').value.trim();
            const wilaya        = document.getElementById('wilaya').value;
            const commune       = document.getElementById('commune').value.trim();
            const phone         = document.getElementById('phone').value.trim();

            if (!specialty)     { showError('La spécialité est requise'); return; }
            if (!licenseNumber) { showError('Le numéro de licence est requis'); return; }
            if (!wilaya)        { showError('La wilaya est requise'); return; }
            if (!commune)       { showError('La commune est requise'); return; }
            if (!phone)         { showError('Le téléphone est requis'); return; }
            if (typeof Validator !== 'undefined' && !Validator.isValidPhone(phone)) { showError('Numéro de téléphone invalide'); return; }
            showStep(3);
        });

        // Step 3
        document.getElementById('backStep3Btn').addEventListener('click', () => showStep(2));
        document.getElementById('submitBtn').addEventListener('click', async () => {
            hideMessages();
            const submitBtn     = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');
            submitBtn.disabled  = true;
            submitBtnText.textContent = 'Création en cours...';

            const availability = {};
            document.querySelectorAll('.day-toggle').forEach(toggle => {
                const day     = toggle.dataset.day;
                const dayItem = document.getElementById(`dayItem-${day}`);
                const times   = dayItem.querySelectorAll('input[type="time"]');
                availability[day] = {
                    active: toggle.classList.contains('active'),
                    open:   times[0]?.value || '08:00',
                    close:  times[1]?.value || '17:00'
                };
            });

            const formData = {
                firstName:     document.getElementById('firstName').value.trim(),
                lastName:      document.getElementById('lastName').value.trim(),
                email:         document.getElementById('email').value.trim(),
                password:      document.getElementById('password').value,
                specialty:     document.getElementById('specialty').value,
                licenseNumber: document.getElementById('licenseNumber').value.trim(),
                wilaya:        document.getElementById('wilaya').value,
                commune:       document.getElementById('commune').value.trim(),
                phone:         document.getElementById('phone').value.trim(),
                address:       document.getElementById('address').value.trim(),
                bio:           document.getElementById('bio').value.trim(),
                availability
            };

            try {
                if (typeof API !== 'undefined' && API.post) {
                    await API.post('/auth/doctor/register', formData);
                } else {
                    await new Promise(r => setTimeout(r, 1000));
                    console.log('Form data:', formData);
                }
                showSuccess('Compte créé avec succès ! Redirection...');
                setTimeout(() => { window.location.href = 'doctor-login.html'; }, 2000);
            } catch (error) {
                showError(error.message || 'Erreur lors de la création du compte');
                submitBtn.disabled = false;
                submitBtnText.textContent = 'Créer mon compte';
            }
        });
    </script>
</body>
</html>
