<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihati - Mot de passe oublié</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --surface: #1e2d45;
            --border: rgba(99,179,237,0.10);
            --teal: #2dd4bf;
            --teal-dim: rgba(45,212,191,0.12);
            --teal-glow: rgba(45,212,191,0.25);
            --teal-border: rgba(45,212,191,0.28);
            --blue: #60a5fa;
            --rose: #f87171;
            --rose-dim: rgba(248,113,113,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 14px;
            --radius-sm: 9px;
            --font: 'Sora', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0b0f1a 0%, #111827 50%, #0b0f1a 100%);
        }
        .bg-animated::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: var(--teal);
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.22;
            top: -300px; right: -250px;
            animation: float 20s infinite ease-in-out;
        }
        .bg-animated::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: var(--blue);
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.18;
            bottom: -250px; left: -200px;
            animation: float 20s infinite ease-in-out;
            animation-delay: -10s;
        }
        @keyframes float {
            0%,100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(60px,-60px) scale(1.1); }
            66% { transform: translate(-40px,40px) scale(0.9); }
        }

        /* ── Auth Navbar ── */
        .auth-navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 64px;
            background: rgba(11,15,26,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }
        .navbar-logo img { height: 32px; display: block; }
        .navbar-actions { display: flex; align-items: center; gap: 10px; }
        .navbar-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font);
        }
        .navbar-back:hover {
            color: var(--teal);
            border-color: var(--teal-border);
            background: var(--teal-dim);
        }
        .navbar-lang {
            width: 40px; height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .navbar-lang:hover { border-color: var(--teal-border); background: var(--teal-dim); }
        .navbar-lang img { width: 24px; height: 16px; border-radius: 3px; display: block; }

        /* ── Page container ── */
        .page-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 24px 20px 40px;
            margin-top: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 64px);
            animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1);
        }
        .page-inner { width: 100%; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .icon-wrap {
            width: 72px; height: 72px;
            background: var(--teal-dim);
            border: 1px solid var(--teal-border);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 30px var(--teal-glow);
        }
        .icon-wrap i { font-size: 32px; color: var(--teal); }
        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .page-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto;
        }

        .form-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
        }

        .alert-box {
            display: none;
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; } }
        .alert-box i { font-size: 16px; flex-shrink: 0; }
        .alert-box.show { display: flex; }
        .alert-box.error { background: var(--rose-dim); border: 1px solid rgba(248,113,113,0.3); color: var(--rose); }

        .form-group { margin-bottom: 24px; }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .input-wrapper { position: relative; }
        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px var(--teal-dim);
        }
        .form-input::placeholder { color: var(--text-dim); }
        .input-icon {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            color: var(--teal);
            font-size: 16px;
            pointer-events: none;
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--teal), var(--blue));
            border: none;
            border-radius: var(--radius-sm);
            color: #0b0f1a;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .submit-btn:hover:not(:disabled) {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--teal-glow);
        }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .back-login-link {
            display: block;
            text-align: center;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .back-login-link:hover {
            border-color: var(--teal);
            color: var(--teal);
            background: var(--teal-dim);
        }

        /* ── Success state ── */
        .success-state {
            text-align: center;
            padding: 40px 24px;
            animation: scaleIn 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to   { opacity: 1; transform: scale(1); }
        }
        .success-icon {
            width: 80px; height: 80px;
            background: var(--green-dim);
            border: 2px solid rgba(52,211,153,0.3);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .success-icon i { font-size: 36px; color: var(--green); }
        .success-title { font-size: 22px; font-weight: 700; color: var(--green); margin-bottom: 12px; }
        .success-msg { font-size: 13.5px; color: var(--text-muted); line-height: 1.7; margin-bottom: 32px; }

        [dir="rtl"] .input-icon { left: auto; right: 16px; }
        [dir="rtl"] .form-input { padding: 0 44px 0 16px; }

        @media (max-width: 480px) {
            .form-card { padding: 24px; }
            .navbar-back span { display: none; }
        }
    </style>
</head>
<body>

<div class="bg-animated"></div>

<nav class="auth-navbar">
    <a href="../../index.html" class="navbar-logo">
        <img src="../../assets/icons/sihati_lockup.svg" alt="Sihati">
    </a>
    <div class="navbar-actions">
        <a href="pharmacy-login.html" class="navbar-back" id="backBtn">
            <i class="fas fa-arrow-left"></i>
            <span id="backBtnText">Retour à la connexion</span>
        </a>
        <button class="navbar-lang" id="langToggleBtn" title="Langue">
            <img id="langFlagImg" src="../../assets/icons/dz-flag.svg" alt="AR">
        </button>
    </div>
</nav>

<div class="page-container">
    <div class="page-inner">

        <!-- Form view -->
        <div id="formView">
            <div class="icon-section">
                <div class="icon-wrap"><i class="fas fa-key"></i></div>
                <h1 class="page-title" id="pageTitle">Mot de passe oublié</h1>
                <p class="page-subtitle" id="pageSubtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>
            </div>

            <div class="form-card">
                <div id="alertMsg" class="alert-box">
                    <i id="alertIcon" class="fas fa-exclamation-circle"></i>
                    <span id="alertText"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" id="emailLabel">Adresse email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="emailInput" class="form-input" placeholder="pharmacie@exemple.dz" autocomplete="email">
                    </div>
                </div>

                <button class="submit-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                    <span id="sendBtnText">Envoyer le lien</span>
                </button>

                <a href="pharmacy-login.html" class="back-login-link">
                    <i class="fas fa-arrow-left"></i> <span id="backLoginText">Retour à la connexion</span>
                </a>
            </div>
        </div>

        <!-- Success view -->
        <div class="form-card" id="successView" style="display:none;">
            <div class="success-state">
                <div class="success-icon"><i class="fas fa-envelope-circle-check"></i></div>
                <div class="success-title" id="successTitle">Email envoyé !</div>
                <p class="success-msg" id="successMsg">
                    Si un compte existe avec cet email, vous recevrez un lien de réinitialisation dans quelques minutes.
                </p>
                <a href="pharmacy-login.html" class="back-login-link">
                    <i class="fas fa-arrow-left"></i> <span id="successBackText">Retour à la connexion</span>
                </a>
            </div>
        </div>

    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/pharmacy-translations.js"></script>
<script src="../js/api.js"></script>
<script>
    function applyI18n() {
        const lang = localStorage.getItem('sihati_lang') || 'fr';
        document.documentElement.lang = lang;
        document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';

        document.getElementById('pageTitle').textContent       = pt('forgot_title');
        document.getElementById('pageSubtitle').textContent    = pt('forgot_subtitle');
        document.getElementById('emailLabel').textContent      = pt('forgot_email_label');
        document.getElementById('sendBtnText').textContent     = pt('forgot_send_btn');
        document.getElementById('backLoginText').textContent   = pt('forgot_back_login');
        document.getElementById('backBtnText').textContent     = pt('forgot_back_login');
        document.getElementById('successTitle').textContent    = pt('forgot_success_title');
        document.getElementById('successMsg').textContent      = pt('forgot_success_msg');
        document.getElementById('successBackText').textContent = pt('forgot_back_login');

        const flagImg = document.getElementById('langFlagImg');
        if (lang === 'fr') { flagImg.src = '../../assets/icons/dz-flag.svg'; flagImg.alt = 'AR'; }
        else               { flagImg.src = '../../assets/icons/fr-flag.svg'; flagImg.alt = 'FR'; }
    }
    applyI18n();

    document.getElementById('langToggleBtn').addEventListener('click', () => {
        const cur = localStorage.getItem('sihati_lang') || 'fr';
        localStorage.setItem('sihati_lang', cur === 'fr' ? 'ar' : 'fr');
        window.location.reload();
    });

    const alertDiv  = document.getElementById('alertMsg');
    const alertIcon = document.getElementById('alertIcon');
    const alertText = document.getElementById('alertText');
    const sendBtn   = document.getElementById('sendBtn');
    const emailInput= document.getElementById('emailInput');

    function showError(msg) {
        alertDiv.className = 'alert-box error show';
        alertIcon.className = 'fas fa-exclamation-circle';
        alertText.textContent = msg;
    }

    async function handleSubmit() {
        const email = emailInput.value.trim();
        alertDiv.classList.remove('show');

        if (!email || !email.includes('@')) {
            showError(pt('forgot_email_label') + ' invalide');
            return;
        }

        sendBtn.disabled = true;
        const origHTML   = sendBtn.innerHTML;
        sendBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${pt('forgot_sending')}`;

        try {
            await api.forgotPassword(email);
        } catch (_) {
            // Always show success — don't reveal if email exists
        } finally {
            sendBtn.disabled  = false;
            sendBtn.innerHTML = origHTML;
            document.getElementById('formView').style.display    = 'none';
            document.getElementById('successView').style.display = 'block';
        }
    }

    sendBtn.addEventListener('click', handleSubmit);
    emailInput.addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmit(); });
</script>
</body>
</html>
