<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihati - Connexion Pharmacie</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --surface: #1e2d45;
            --surface2: #243552;
            --border: rgba(99,179,237,0.10);
            --border2: rgba(99,179,237,0.18);
            --teal: #2dd4bf;
            --teal-dim: rgba(45,212,191,0.12);
            --teal-glow: rgba(45,212,191,0.25);
            --blue: #60a5fa;
            --blue-dim: rgba(96,165,250,0.12);
            --amber: #fbbf24;
            --amber-dim: rgba(251,191,36,0.12);
            --rose: #f87171;
            --rose-dim: rgba(248,113,113,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 14px;
            --radius-sm: 8px;
            --font: 'Sora', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0b0f1a 0%, #111827 50%, #0b0f1a 100%);
        }

        .bg-animated::before,
        .bg-animated::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .bg-animated::before {
            width: 600px;
            height: 600px;
            background: var(--teal);
            top: -300px;
            right: -250px;
        }

        .bg-animated::after {
            width: 500px;
            height: 500px;
            background: var(--blue);
            bottom: -250px;
            left: -200px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 40px) scale(0.9); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo i {
            font-size: 36px;
            color: var(--teal);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text);
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            backdrop-filter: blur(10px);
        }

        .error-box {
            display: none;
            background: var(--rose-dim);
            border: 1px solid var(--rose);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 24px;
            color: var(--rose);
            font-size: 13px;
            align-items: center;
            gap: 10px;
        }

        .error-box i {
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px var(--teal-dim);
        }

        .form-input::placeholder {
            color: var(--text-dim);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--teal);
            font-size: 16px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--teal);
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--teal);
        }

        .forgot-link {
            color: var(--teal);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--blue);
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--teal), var(--blue));
            border: none;
            border-radius: var(--radius-sm);
            color: #0b0f1a;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0 20px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            color: var(--text-dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .register-link {
            display: block;
            text-align: center;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .register-link:hover {
            border-color: var(--teal);
            color: var(--teal);
            background: var(--teal-dim);
        }
    </style>
</head>
<body>

<div class="bg-animated"></div>

<div class="login-container">
    <div class="logo-section">
        <div class="logo">
            <i class="fas fa-hospital"></i>
        </div>
        <h1 class="login-title">Sihati Pharmacie</h1>
        <p class="login-subtitle">Connectez-vous à votre espace professionnel</p>
    </div>

    <div class="form-card">
        <div id="errorMsg" class="error-box">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <div class="form-group">
            <label class="form-label">Email</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" class="form-input" value="pharmacie.ennour@sihati.dz" placeholder="pharmacie@exemple.dz">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" class="form-input" value="password123" placeholder="••••••••">
                <button type="button" class="toggle-password" id="togglePassword">
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
            </div>
        </div>

        <div class="options-row">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                <span>Se souvenir de moi</span>
            </label>
            <a href="#" class="forgot-link">Mot de passe oublie</a>
        </div>

        <button class="submit-btn" id="loginBtn">
            <i class="fas fa-arrow-right-to-bracket"></i>
            <span>Se connecter</span>
        </button>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">Nouveau sur Sihati</span>
            <div class="divider-line"></div>
        </div>

        <a href="pharmacy-register.html" class="register-link">
            <i class="fas fa-user-plus"></i> Creer un compte pharmacie
        </a>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../../assets/js/core.js"></script>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<script src="../js/api.js"></script>
<script>
    const errorDiv = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberCheckbox = document.getElementById('rememberMe');

    function showError(message) {
        errorText.textContent = message;
        errorDiv.style.display = 'flex';
        setTimeout(() => {
            errorDiv.style.display = 'none';
        }, 5000);
    }

    function hideError() {
        errorDiv.style.display = 'none';
    }

    function saveCredentials(email, password) {
        if (rememberCheckbox.checked) {
            localStorage.setItem('savedEmail', email);
            localStorage.setItem('savedPassword', password);
        } else {
            localStorage.removeItem('savedEmail');
            localStorage.removeItem('savedPassword');
        }
    }

    function loadSavedCredentials() {
        const savedEmail = localStorage.getItem('savedEmail');
        const savedPassword = localStorage.getItem('savedPassword');
        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberCheckbox.checked = true;
        }
        if (savedPassword && rememberCheckbox.checked) {
            passwordInput.value = savedPassword;
        }
    }

    document.getElementById('togglePassword').addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        const icon = document.getElementById('toggleIcon');
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    });

    async function handleLogin() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        hideError();
        
        if (!email || !password) {
            showError('Veuillez remplir tous les champs');
            return;
        }
        
        loginBtn.disabled = true;
        const originalText = loginBtn.innerHTML;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
        
        try {
            const res = await api.login(email, password);
            const user = STORAGE.getUser();
            
            console.log("Utilisateur connecte:", user);
            
            const pharmacies = await api.getPharmacyByUserId(user.id);
            console.log("Pharmacies recues:", pharmacies);
            
            if (pharmacies.data && pharmacies.data.length > 0) {
                const pharmacy = pharmacies.data.find(p => p.userId === user.id);
                
                if (pharmacy) {
                    api.setPharmacyId(pharmacy.id);
                    saveCredentials(email, password);
                    console.log("Pharmacie selectionnee:", pharmacy.pharmacyName);
                    window.location.href = 'pharmacy-dashboard.html';
                } else {
                    showError('Aucune pharmacie associee a ce compte');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = originalText;
                }
            } else {
                showError('Aucune pharmacie trouvee pour ce compte');
                loginBtn.disabled = false;
                loginBtn.innerHTML = originalText;
            }
        } catch (err) {
            console.error("Erreur:", err);
            showError(err.message || 'Email ou mot de passe incorrect');
            loginBtn.disabled = false;
            loginBtn.innerHTML = originalText;
        }
    }

    loginBtn.addEventListener('click', handleLogin);
    
    passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
    
    emailInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });

    loadSavedCredentials();
</script>
</body>
</html>
