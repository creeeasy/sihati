<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihati - Inscription Pharmacie</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --surface: #1e2d45;
            --surface2: #243552;
            --border: rgba(99,179,237,0.10);
            --border2: rgba(99,179,237,0.18);
            --teal: #2dd4bf;
            --teal-dim: rgba(45,212,191,0.12);
            --teal-glow: rgba(45,212,191,0.25);
            --blue: #60a5fa;
            --blue-dim: rgba(96,165,250,0.12);
            --amber: #fbbf24;
            --amber-dim: rgba(251,191,36,0.12);
            --rose: #f87171;
            --rose-dim: rgba(248,113,113,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 14px;
            --radius-sm: 8px;
            --font: 'Sora', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0b0f1a 0%, #111827 50%, #0b0f1a 100%);
        }

        .bg-animated::before,
        .bg-animated::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .bg-animated::before {
            width: 600px;
            height: 600px;
            background: var(--teal);
            top: -300px;
            right: -250px;
        }

        .bg-animated::after {
            width: 500px;
            height: 500px;
            background: var(--blue);
            bottom: -250px;
            left: -200px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 40px) scale(0.9); }
        }

        .register-container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo i {
            font-size: 36px;
            color: var(--teal);
        }

        .register-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text);
            margin-bottom: 6px;
        }

        .register-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
        }

        .error, .success {
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .error {
            background: var(--rose-dim);
            border: 1px solid var(--rose);
            color: var(--rose);
        }

        .success {
            background: var(--green-dim);
            border: 1px solid var(--green);
            color: var(--green);
        }

        .error i, .success i {
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font);
            font-size: 13.5px;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px var(--teal-dim);
        }

        input::placeholder, select::placeholder {
            color: var(--text-dim);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--teal), var(--blue));
            color: #0b0f1a;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-register:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .location-input {
            position: relative;
        }

        .location-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--teal);
            font-size: 16px;
            transition: color 0.2s;
        }

        .location-btn:hover {
            color: var(--blue);
        }

        .coordinates {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 6px;
        }

        hr {
            margin: 24px 0;
            border: none;
            border-top: 1px solid var(--border);
        }

        h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h4 i {
            color: var(--teal);
            font-size: 16px;
        }

        .info-text {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .login-link a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-link a:hover {
            color: var(--blue);
        }

        @media (max-width: 640px) {
            .form-card {
                padding: 24px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .register-container {
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>

<div class="bg-animated"></div>

<div class="register-container">
    <div class="logo-section">
        <div class="logo">
            <i class="fas fa-hospital"></i>
        </div>
        <h1 class="register-title">Sihati Pharmacie</h1>
        <p class="register-subtitle">Creez votre espace professionnel</p>
    </div>

    <div class="form-card">
        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>
        
        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Nom de la pharmacie</label>
                    <input type="text" id="pharmacyName" placeholder="Pharmacie Centrale" required>
                </div>
                <div class="form-group">
                    <label>Telephone</label>
                    <input type="tel" id="phone" placeholder="023123456" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="contact@pharmacie.dz" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" placeholder="8 caracteres minimum" required>
                </div>
                <div class="form-group">
                    <label>Confirmer mot de passe</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Adresse</label>
                <input type="text" id="address" placeholder="123 Rue Didouche Mourad" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Wilaya</label>
                    <select id="wilaya" required>
                        <option value="">Selectionnez une wilaya</option>
                        <option value="Adrar">Adrar</option>
                        <option value="Alger">Alger</option>
                        <option value="Annaba">Annaba</option>
                        <option value="Batna">Batna</option>
                        <option value="Bejaia">Bejaia</option>
                        <option value="Biskra">Biskra</option>
                        <option value="Blida">Blida</option>
                        <option value="Bouira">Bouira</option>
                        <option value="Constantine">Constantine</option>
                        <option value="Djelfa">Djelfa</option>
                        <option value="Medea">Medea</option>
                        <option value="Mostaganem">Mostaganem</option>
                        <option value="Oran">Oran</option>
                        <option value="Setif">Setif</option>
                        <option value="Sidi Bel Abbes">Sidi Bel Abbes</option>
                        <option value="Tizi Ouzou">Tizi Ouzou</option>
                        <option value="Tlemcen">Tlemcen</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Commune</label>
                    <input type="text" id="commune" placeholder="Ex: Alger Centre">
                </div>
            </div>
            
            <div class="form-group">
                <label>WhatsApp (optionnel)</label>
                <input type="tel" id="whatsapp" placeholder="0555123456">
            </div>
            
            <hr>
            
            <h4><i class="fas fa-location-dot"></i> Localisation GPS</h4>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Latitude</label>
                    <div class="location-input">
                        <input type="number" id="latitude" step="any" placeholder="36.7689" required>
                        <button type="button" class="location-btn" onclick="getCurrentLocation()">
                            <i class="fas fa-crosshairs"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Longitude</label>
                    <input type="number" id="longitude" step="any" placeholder="3.0582" required>
                </div>
            </div>
            <div class="coordinates" id="locationStatus"></div>
            
            <hr>
            
            <h4><i class="fas fa-clock"></i> Horaires d'ouverture</h4>
            <p class="info-text">Vous pourrez configurer vos horaires apres inscription dans votre profil.</p>
            
            <button type="submit" class="btn-register" id="registerBtn">
                <i class="fas fa-user-plus"></i>
                <span>Creer mon compte pharmacie</span>
            </button>
        </form>
        
        <div class="login-link">
            Deja inscrit ? <a href="pharmacy-login.html">Se connecter</a>
        </div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../../assets/js/core.js"></script>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<script src="../js/api.js"></script>
<script>
    const errorDiv = document.getElementById('errorMsg');
    const successDiv = document.getElementById('successMsg');
    const registerBtn = document.getElementById('registerBtn');
    const registerForm = document.getElementById('registerForm');
    
    function showError(message) {
        errorDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
        errorDiv.style.display = 'flex';
        successDiv.style.display = 'none';
        setTimeout(() => {
            errorDiv.style.display = 'none';
        }, 5000);
    }
    
    function showSuccess(message) {
        successDiv.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
        successDiv.style.display = 'flex';
        errorDiv.style.display = 'none';
    }
    
    function getCurrentLocation() {
        const statusEl = document.getElementById('locationStatus');
        statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Recuperation de la position...';
        
        if (!navigator.geolocation) {
            statusEl.innerHTML = 'Geolocalisation non supportee';
            return;
        }
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                document.getElementById('latitude').value = position.coords.latitude.toFixed(7);
                document.getElementById('longitude').value = position.coords.longitude.toFixed(7);
                statusEl.innerHTML = 'Position GPS recuperee';
                setTimeout(() => { statusEl.innerHTML = ''; }, 3000);
            },
            (error) => {
                let message = '';
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        message = 'Permission refusee. Activez la geolocalisation.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        message = 'Position indisponible.';
                        break;
                    case error.TIMEOUT:
                        message = 'Delai depasse.';
                        break;
                    default:
                        message = 'Erreur de geolocalisation.';
                }
                statusEl.innerHTML = message;
            }
        );
    }
    
    function validateAlgerianPhone(phone) {
        const phoneStr = phone.toString();
        return /^(0[5-7]|[+][2][1][3]0[5-7])[0-9]{8}$/.test(phoneStr) || /^0[5-7][0-9]{8}$/.test(phoneStr);
    }
    
    async function handleRegister(e) {
        e.preventDefault();
        
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        
        const pharmacyName = document.getElementById('pharmacyName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const address = document.getElementById('address').value.trim();
        const wilaya = document.getElementById('wilaya').value;
        const commune = document.getElementById('commune').value.trim();
        const whatsapp = document.getElementById('whatsapp').value.trim();
        const latitude = parseFloat(document.getElementById('latitude').value);
        const longitude = parseFloat(document.getElementById('longitude').value);
        
        if (!pharmacyName || !phone || !email || !password || !address || !wilaya) {
            showError('Veuillez remplir tous les champs obligatoires');
            return;
        }
        
        if (password !== confirmPassword) {
            showError('Les mots de passe ne correspondent pas');
            return;
        }
        
        if (password.length < 8) {
            showError('Le mot de passe doit contenir au moins 8 caracteres');
            return;
        }
        
        if (!validateAlgerianPhone(phone)) {
            showError('Numero de telephone invalide (ex: 0555123456)');
            return;
        }
        
        if (isNaN(latitude) || isNaN(longitude)) {
            showError('Veuillez saisir des coordonnees GPS valides');
            return;
        }
        
        registerBtn.disabled = true;
        registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creation du compte...';
        
        try {
            const userData = {
                email: email,
                password: password,
                fullName: pharmacyName,
                phoneNumber: phone,
                role: 'pharmacy',
                address: address,
                wilaya: wilaya,
                pharmacyData: {
                    pharmacyName: pharmacyName,
                    address: address,
                    wilaya: wilaya,
                    commune: commune || null,
                    latitude: latitude,
                    longitude: longitude,
                    phone: phone,
                    whatsappNumber: whatsapp || null,
                }
            };
            
            console.log('Envoi des donnees:', userData);
            
            const userRes = await api.register(userData);
            
            console.log('Reponse:', userRes);
            
            if (!userRes.success) {
                throw new Error(userRes.message || 'Erreur lors de l\'inscription');
            }
            
            showSuccess('Compte cree avec succes ! Redirection vers la connexion...');
            
            setTimeout(() => {
                window.location.href = 'pharmacy-login.html';
            }, 2000);
            
        } catch (err) {
            console.error('Erreur detaillee:', err);
            showError(err.message || 'Erreur lors de l\'inscription');
            registerBtn.disabled = false;
            registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Creer mon compte pharmacie';
        }
    }
    
    registerForm.addEventListener('submit', handleRegister);
    
    document.getElementById('password').addEventListener('input', function() {
        const strength = this.value.length;
        if (strength > 0 && strength < 6) {
            this.style.borderColor = 'var(--rose)';
        } else if (strength >= 6 && strength < 8) {
            this.style.borderColor = 'var(--amber)';
        } else if (strength >= 8) {
            this.style.borderColor = 'var(--green)';
        }
    });
</script>
</body>
</html>
