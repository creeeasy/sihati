<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihati - Inscription Pharmacie</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --surface: #1e2d45;
            --surface2: #243552;
            --border: rgba(99,179,237,0.10);
            --border2: rgba(99,179,237,0.18);
            --teal: #2dd4bf;
            --teal-dim: rgba(45,212,191,0.12);
            --teal-glow: rgba(45,212,191,0.25);
            --teal-border: rgba(45,212,191,0.28);
            --blue: #60a5fa;
            --blue-dim: rgba(96,165,250,0.12);
            --amber: #fbbf24;
            --amber-dim: rgba(251,191,36,0.12);
            --rose: #f87171;
            --rose-dim: rgba(248,113,113,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 14px;
            --radius-sm: 8px;
            --font: 'Sora', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ── Animated background ── */
        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0b0f1a 0%, #111827 50%, #0b0f1a 100%);
        }
        .bg-animated::before, .bg-animated::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }
        .bg-animated::before {
            width: 600px; height: 600px;
            background: var(--teal);
            top: -300px; right: -250px;
        }
        .bg-animated::after {
            width: 500px; height: 500px;
            background: var(--blue);
            bottom: -250px; left: -200px;
            animation-delay: -10s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 40px) scale(0.9); }
        }

        /* ── Auth Navbar ── */
        .auth-navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 64px;
            background: rgba(11, 15, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }
        .navbar-logo img {
            height: 32px;
            display: block;
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font);
        }
        .navbar-back:hover {
            color: var(--teal);
            border-color: var(--teal-border);
            background: var(--teal-dim);
        }
        .navbar-lang {
            width: 40px; height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .navbar-lang:hover {
            border-color: var(--teal-border);
            background: var(--teal-dim);
        }
        .navbar-lang img {
            width: 24px; height: 16px;
            border-radius: 3px;
            display: block;
        }

        /* ── Page layout ── */
        .register-container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 88px 20px 48px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Logo section ── */
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo {
            width: 70px; height: 70px;
            background: var(--surface);
            border: 1px solid var(--teal-border);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 32px var(--teal-glow);
        }
        .logo i { font-size: 36px; color: var(--teal); }
        .register-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text);
            margin-bottom: 6px;
        }
        .register-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ── Form card ── */
        .form-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
        }

        /* ── Alert ── */
        .alert-box {
            display: none;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 24px;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .alert-box i { font-size: 16px; flex-shrink: 0; }
        .alert-box.show { display: flex; }
        .alert-box.error {
            background: var(--rose-dim);
            border: 1px solid rgba(248,113,113,0.3);
            color: var(--rose);
        }
        .alert-box.success {
            background: var(--green-dim);
            border: 1px solid rgba(52,211,153,0.3);
            color: var(--green);
        }

        /* ── Section headers ── */
        .section-divider {
            margin: 24px 0 18px;
            border: none;
            border-top: 1px solid var(--border);
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--teal);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-note {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        /* ── Form elements ── */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group { margin-bottom: 16px; }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 7px;
        }

        /* ── Inputs ── */
        .input-wrapper { position: relative; }
        .form-input, .form-select {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font);
            font-size: 13.5px;
            transition: all 0.2s ease;
            outline: none;
        }
        .input-wrapper .form-input { padding: 0 14px 0 44px; }
        .input-wrapper .form-input.has-toggle { padding-right: 44px; }
        .form-input.plain, .form-select { padding: 0 14px; }
        .form-input:focus, .form-select:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px var(--teal-dim);
        }
        .form-input::placeholder { color: var(--text-dim); }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--teal);
            font-size: 15px;
            pointer-events: none;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 15px;
            transition: color 0.2s;
            padding: 4px;
        }
        .toggle-password:hover { color: var(--teal); }

        /* Password strength bar */
        .pwd-strength {
            height: 3px;
            border-radius: 2px;
            margin-top: 6px;
            background: var(--surface);
            overflow: hidden;
        }
        .pwd-strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
        }
        .pwd-strength-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* GPS button */
        .btn-outline {
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--teal-border);
            border-radius: var(--radius-sm);
            color: var(--teal);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }
        .btn-outline:hover {
            background: var(--teal-dim);
            border-color: var(--teal);
        }
        .gps-status {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 8px;
            min-height: 16px;
        }

        /* Submit */
        .submit-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--teal), var(--blue));
            color: #0b0f1a;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover:not(:disabled) {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--teal-glow);
        }
        .submit-btn:active:not(:disabled) { transform: translateY(0); }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer */
        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .footer-links a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-links a:hover { color: var(--blue); }

        /* RTL overrides */
        [dir="rtl"] .input-icon { left: auto; right: 16px; }
        [dir="rtl"] .input-wrapper .form-input { padding: 0 44px 0 14px; }
        [dir="rtl"] .input-wrapper .form-input.has-toggle { padding-left: 44px; padding-right: 44px; }
        [dir="rtl"] .toggle-password { right: auto; left: 14px; }
        [dir="rtl"] .navbar-back i { transform: scaleX(-1); }

        @media (max-width: 640px) {
            .form-card { padding: 24px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .navbar-back span { display: none; }
        }
    </style>
</head>

<script>
    // ── i18n ────────────────────────────────────────────────────────────
    function applyI18n() {
        const lang = localStorage.getItem('sihati_lang') || 'fr';
        document.documentElement.lang = lang;
        document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';

        document.getElementById('backHomeText').textContent       = pt('nav_back_home');
        document.getElementById('registerTitle').textContent      = pt('register_title');
        document.getElementById('registerSubtitle').textContent   = pt('register_subtitle');
        document.getElementById('labelPharmacyName').textContent  = pt('label_pharmacy_name');
        document.getElementById('labelPhone').textContent         = pt('label_phone');
        document.getElementById('labelEmail').textContent         = pt('label_email');
        document.getElementById('labelPassword').textContent      = pt('label_password');
        document.getElementById('labelConfirm').textContent       = pt('label_confirm');
        document.getElementById('labelAddress').textContent       = pt('label_address');
        document.getElementById('labelWilaya').textContent        = pt('label_wilaya');
        document.getElementById('labelCommune').textContent       = pt('label_commune');
        document.getElementById('labelWhatsapp').textContent      = pt('label_whatsapp');
        document.getElementById('sectionGps').textContent         = pt('section_gps');
        document.getElementById('labelLat').textContent           = pt('label_lat');
        document.getElementById('labelLng').textContent           = pt('label_lng');
        document.getElementById('getLocationText').textContent    = pt('get_location');
        document.getElementById('sectionHours').textContent       = pt('section_hours');
        document.getElementById('hoursNote').textContent          = pt('hours_note');
        document.getElementById('registerBtnText').textContent    = pt('register_btn');
        document.getElementById('wilayaPlaceholder').textContent  = pt('wilaya_placeholder');
        document.getElementById('footerLogin').innerHTML =
            pt('footer_login') + ' <a href="pharmacy-login.html">' + pt('login_link') + '</a>';

        // Flag: show the OTHER language
        const flagImg = document.getElementById('langFlagImg');
        if (lang === 'fr') {
            flagImg.src = '../../assets/icons/dz-flag.svg'; flagImg.alt = 'AR';
        } else {
            flagImg.src = '../../assets/icons/fr-flag.svg'; flagImg.alt = 'FR';
        }
    }
    applyI18n();

    document.getElementById('langToggleBtn').addEventListener('click', () => {
        const cur = localStorage.getItem('sihati_lang') || 'fr';
        localStorage.setItem('sihati_lang', cur === 'fr' ? 'ar' : 'fr');
        window.location.reload();
    });

    // ── Alert helpers ───────────────────────────────────────────────────
    const alertDiv  = document.getElementById('alertMsg');
    const alertIcon = document.getElementById('alertIcon');
    const alertText = document.getElementById('alertText');

    function showAlert(msg, type) {
        alertDiv.className = 'alert-box ' + type + ' show';
        alertIcon.className = type === 'error'
            ? 'fas fa-exclamation-circle'
            : 'fas fa-check-circle';
        alertText.textContent = msg;
        alertDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        if (type === 'success') setTimeout(() => alertDiv.classList.remove('show'), 4000);
    }
    function showError(msg)   { showAlert(msg, 'error'); }
    function showSuccess(msg) { showAlert(msg, 'success'); }
    function hideAlert()      { alertDiv.classList.remove('show'); }

    // ── Password toggles ────────────────────────────────────────────────
    function makeToggle(btnId, iconId, inputId) {
        document.getElementById(btnId).addEventListener('click', function () {
            const input = document.getElementById(inputId);
            const icon  = document.getElementById(iconId);
            input.type  = input.type === 'password' ? 'text' : 'password';
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });
    }
    makeToggle('togglePassword1', 'toggleIcon1', 'password');
    makeToggle('togglePassword2', 'toggleIcon2', 'confirmPassword');

    // ── Password strength ────────────────────────────────────────────────
    document.getElementById('password').addEventListener('input', function () {
        const len = this.value.length;
        const bar = document.getElementById('pwdStrengthBar');
        const lbl = document.getElementById('pwdStrengthLabel');
        let width = 0, color = '', label = '';

        if (len === 0) { bar.style.width = '0%'; lbl.textContent = ''; return; }
        if (len < 6)        { width = 25; color = 'var(--rose)';  label = pt('pwd_too_weak') || 'Trop faible'; }
        else if (len < 8)   { width = 50; color = 'var(--amber)'; label = pt('pwd_weak')     || 'Faible'; }
        else if (len < 12)  { width = 75; color = 'var(--amber)'; label = pt('pwd_medium')   || 'Moyen'; }
        else                { width = 100; color = 'var(--green)'; label = pt('pwd_strong')   || 'Fort'; }

        bar.style.width      = width + '%';
        bar.style.background = color;
        lbl.style.color      = color;
        lbl.textContent      = label;
    });

    // ── GPS ─────────────────────────────────────────────────────────────
    document.getElementById('getLocationBtn').addEventListener('click', () => {
        const statusEl = document.getElementById('gpsStatus');
        if (!('geolocation' in navigator)) {
            statusEl.textContent = pt('gps_unsupported');
            return;
        }
        statusEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${pt('gps_loading')}`;
        navigator.geolocation.getCurrentPosition(
            pos => {
                document.getElementById('latitude').value  = pos.coords.latitude.toFixed(7);
                document.getElementById('longitude').value = pos.coords.longitude.toFixed(7);
                statusEl.textContent = pt('gps_success');
                setTimeout(() => { statusEl.textContent = ''; }, 3000);
            },
            err => {
                const msgs = {
                    [err.PERMISSION_DENIED]:  pt('gps_denied'),
                    [err.POSITION_UNAVAILABLE]: pt('gps_unavailable'),
                    [err.TIMEOUT]:            pt('gps_timeout'),
                };
                statusEl.textContent = msgs[err.code] || pt('gps_error');
            }
        );
    });

    // ── Validation ──────────────────────────────────────────────────────
    function validatePhone(phone) {
        return /^0[5-7][0-9]{8}$/.test(phone);
    }

    // ── Submit ──────────────────────────────────────────────────────────
    const registerBtn = document.getElementById('registerBtn');

    function resetBtn() {
        registerBtn.disabled = false;
        registerBtn.innerHTML = `<i class="fas fa-user-plus"></i> <span>${pt('register_btn')}</span>`;
    }

    document.getElementById('registerForm').addEventListener('submit', async e => {
        e.preventDefault();
        hideAlert();

        const pharmacyName = document.getElementById('pharmacyName').value.trim();
        const phone        = document.getElementById('phone').value.trim();
        const email        = document.getElementById('email').value.trim();
        const password     = document.getElementById('password').value;
        const confirm      = document.getElementById('confirmPassword').value;
        const address      = document.getElementById('address').value.trim();
        const wilaya       = document.getElementById('wilaya').value;
        const commune      = document.getElementById('commune').value.trim();
        const whatsapp     = document.getElementById('whatsapp').value.trim();
        const latitude     = parseFloat(document.getElementById('latitude').value);
        const longitude    = parseFloat(document.getElementById('longitude').value);

        // Validate
        if (!pharmacyName || !phone || !email || !password || !address || !wilaya) {
            showError(pt('err_required')); return;
        }
        if (password !== confirm) {
            showError(pt('err_pwd_match')); return;
        }
        if (password.length < 8) {
            showError(pt('err_pwd_short')); return;
        }
        if (!validatePhone(phone)) {
            showError(pt('err_phone')); return;
        }
        if (isNaN(latitude) || isNaN(longitude)) {
            showError(pt('err_gps')); return;
        }

        registerBtn.disabled = true;
        registerBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${pt('registering')}`;

        const payload = {
            email,
            password,
            fullName:    pharmacyName,
            phoneNumber: phone,
            role:        'pharmacy',
            address,
            wilaya,
            pharmacyData: {
                pharmacyName,
                address,
                wilaya,
                commune:        commune || null,
                latitude,
                longitude,
                phone,
                whatsappNumber: whatsapp || null,
            }
        };

        try {
            const res = await api.register(payload);
            if (!res.success) throw new Error(res.message || pt('server_error'));
            showSuccess(pt('success_register'));
            setTimeout(() => { window.location.href = 'pharmacy-login.html'; }, 2000);
        } catch (err) {
            showError(err.message || pt('server_error'));
            resetBtn();
        }
    });
</script>
</body>
</html>
