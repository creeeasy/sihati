<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Pharmacie - Sihati</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary:        #2E7BF6;
            --primary-dark:   #1E5BC6;
            --primary-light:  #5B9BFF;
            --primary-soft:   #E8F2FF;
            --secondary:      #00BFA5;
            --secondary-dark: #00897B;
            --secondary-light:#64FFDA;
            --secondary-soft: #E0F7F4;
            --accent:         #FF6B35;
            --accent-soft:    #FFEDE8;
            --success:        #10B981;
            --success-light:  #D1FAE5;
            --warning:        #F59E0B;
            --error:          #EF4444;
            --error-dark:     #DC2626;
            --error-light:    #FEE2E2;
            --text-primary:   #1F2937;
            --text-secondary: #6B7280;
            --text-tertiary:  #9CA3AF;
            --text-disabled:  #D1D5DB;
            --background:     #F9FAFB;
            --surface:        #FFFFFF;
            --border:         #E5E7EB;
            --divider:        #F3F4F6;
        }

        body[data-theme="dark"] {
            --background:     #0f172a;
            --surface:        #1e293b;
            --text-primary:   #F1F5F9;
            --text-secondary: #94a3b8;
            --text-tertiary:  #64748b;
            --border:         rgba(255,255,255,0.08);
            --divider:        rgba(255,255,255,0.05);
            --primary-soft:   rgba(46,123,246,0.12);
            --secondary-soft: rgba(0,191,165,0.12);
            --error-light:    rgba(239,68,68,0.12);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            background: var(--background);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.4s, color 0.4s;
        }

        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .bg-mesh::before {
            content: '';
            position: absolute;
            width: 550px; height: 550px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            top: -220px; right: -180px;
            opacity: 0.10;
            border-radius: 50%;
            animation: drift1 20s ease-in-out infinite;
        }
        .bg-mesh::after {
            content: '';
            position: absolute;
            width: 450px; height: 450px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            bottom: -160px; left: -140px;
            opacity: 0.10;
            border-radius: 50%;
            animation: drift2 24s ease-in-out infinite;
        }
        body[data-theme="dark"] .bg-mesh::before { opacity: 0.18; }
        body[data-theme="dark"] .bg-mesh::after  { opacity: 0.14; }

        @keyframes drift1 {
            0%,100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(-50px, 40px) scale(1.08); }
        }
        @keyframes drift2 {
            0%,100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(60px, -50px) scale(1.1); }
        }

        .theme-toggle {
            position: fixed;
            top: 24px; right: 24px;
            z-index: 1000;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: var(--surface);
            border: 1.5px solid var(--border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            transform: scale(1.08);
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(46,123,246,0.18);
        }
        .theme-toggle i {
            font-size: 20px;
            color: var(--warning);
            transition: transform 0.3s, color 0.3s;
        }
        body[data-theme="dark"] .theme-toggle i { color: var(--primary-light); }
        .theme-toggle:hover i { transform: rotate(18deg); }

        .back-btn {
            position: fixed;
            top: 24px; left: 24px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary-dark);
            transform: translateX(-4px);
            box-shadow: 0 4px 20px rgba(46,123,246,0.15);
        }
        body[data-theme="dark"] .back-btn:hover { color: var(--primary-light); }

        .login-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 60px;
        }

        .login-box {
            max-width: 460px;
            width: 100%;
            animation: slideUp 0.65s cubic-bezier(0.4,0,0.2,1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-wrap {
            width: 80px; height: 80px;
            border-radius: 22px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            box-shadow: 0 6px 24px rgba(46,123,246,0.12);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .logo-wrap:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(46,123,246,0.2);
        }
        .logo-wrap::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .logo-wrap:hover::after { opacity: 1; }
        .logo-wrap i {
            font-size: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .portal-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 100px;
            background: var(--primary-soft);
            color: var(--primary-dark);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 14px;
            border: 1px solid rgba(46,123,246,0.2);
        }
        body[data-theme="dark"] .portal-badge { color: var(--primary-light); }

        .login-title {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .demo-hint {
            background: var(--primary-soft);
            border: 1px solid rgba(46,123,246,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            text-align: center;
            font-size: 0.8rem;
        }
        .demo-hint i { margin-right: 6px; color: var(--primary); }
        .demo-hint span { font-family: monospace; font-weight: 600; background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 6px; }

        .form-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            transition: background 0.4s, border-color 0.4s;
        }
        body[data-theme="dark"] .form-card {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.07);
            box-shadow: none;
        }

        .error-box {
            display: none;
            background: var(--error-light);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 24px;
            color: var(--error-dark);
            font-size: 0.88rem;
            align-items: center;
            gap: 10px;
        }
        body[data-theme="dark"] .error-box { color: #fca5a5; }
        .error-box i { font-size: 18px; color: var(--error); flex-shrink: 0; }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 7px;
            letter-spacing: 0.01em;
        }

        .input-wrapper { position: relative; }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 46px;
            background: var(--divider);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
        }
        body[data-theme="dark"] .form-input {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.08);
        }
        .form-input:focus {
            outline: none;
            background: var(--surface);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(46,123,246,0.12);
        }
        body[data-theme="dark"] .form-input:focus { background: rgba(255,255,255,0.07); }
        .form-input::placeholder { color: var(--text-tertiary); }

        .input-icon {
            position: absolute;
            left: 15px; top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 18px;
            pointer-events: none;
        }

        .toggle-password {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--primary); }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.88rem;
            cursor: pointer;
        }
        .remember-me input {
            width: 16px; height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary);
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-link:hover { color: var(--primary-dark); }
        body[data-theme="dark"] .forgot-link:hover { color: var(--primary-light); }

        .submit-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 14px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(46,123,246,0.28);
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(46,123,246,0.38);
        }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 28px 0;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider-text {
            color: var(--text-tertiary);
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .register-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: var(--primary-soft);
            border: 1.5px solid rgba(46,123,246,0.18);
            border-radius: 14px;
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.3s ease;
        }
        .register-link:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: translateY(-1px);
        }
        body[data-theme="dark"] .register-link {
            background: rgba(46,123,246,0.12);
            border-color: rgba(46,123,246,0.2);
            color: var(--primary-light);
        }
        body[data-theme="dark"] .register-link:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        @media (max-width: 600px) {
            .form-card { padding: 28px 20px; }
            .login-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" aria-label="Changer le thème">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>

    <a href="../../index.html" class="back-btn">
        <i class="bi bi-arrow-left"></i> Retour
    </a>

    <div class="bg-mesh"></div>

    <div class="login-container">
        <div class="login-box">

            <div class="logo-section">
                <div class="logo-wrap">
                    <i class="bi bi-building"></i>
                </div>
                <div class="portal-badge">
                    <i class="bi bi-shield-check-fill"></i> Espace Pharmacie
                </div>
                <h1 class="login-title">Portail Pharmacie</h1>
                <p class="login-subtitle">Connectez-vous à votre espace Sihati</p>
            </div>

            <div class="form-card">

                <div id="errorMessage" class="error-box">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span id="errorText"></span>
                </div>

                <form id="loginForm">

                    <div class="form-group">
                        <label class="form-label">Adresse email</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" class="form-input" id="emailInput"
                                placeholder="pharmacy@test.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mot de passe</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" class="form-input" id="passwordInput"
                                placeholder="••••••••" required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="options-row">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Se souvenir de moi</span>
                        </label>
                        <a href="#" class="forgot-link">Mot de passe oublié ?</a>
                    </div>

                    <button type="submit" class="submit-btn" id="loginButton">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span id="loginButtonText">Se connecter</span>
                    </button>

                </form>

                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">Nouveau sur Sihati ?</span>
                    <div class="divider-line"></div>
                </div>

                <a href="pharmacy-register.html" class="register-link">
                    <i class="bi bi-person-plus-fill"></i>
                    Créer un compte pharmacie
                </a>

            </div>

        </div>
    </div>

    <script src="../js/utils/config.js"></script>
    <script src="../js/utils/mock-api.js"></script>
    <script src="../js/utils/api.js"></script>
    <script src="../js/utils/auth.js"></script>
    <script src="../js/utils/validator.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon   = document.getElementById('themeIcon');
        const body        = document.body;

        const saved = localStorage.getItem('sihati-theme') || 'light';
        apply(saved);

        themeToggle.addEventListener('click', () => {
            const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            apply(next);
            localStorage.setItem('sihati-theme', next);
        });

        function apply(theme) {
            body.setAttribute('data-theme', theme);
            themeIcon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
        }

        document.getElementById('togglePassword').addEventListener('click', function () {
            const input = document.getElementById('passwordInput');
            const icon  = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        const mockPharmacyData = {
            id: 1,
            pharmacyName: "Pharmacie El Amal",
            licenseNumber: "PH-2024-001",
            address: "123 Rue Didouche Mourad, Alger",
            wilaya: "Alger",
            commune: "Alger Centre",
            phone: "023 12 34 56",
            whatsapp: "0555 12 34 56",
            email: "pharmacy@test.com",
            openingHours: {
                weekdays: { open: "08:00", close: "18:00" },
                friday: { open: "14:00", close: "18:00" },
                is24h: false
            }
        };

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email    = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            document.getElementById('errorMessage').style.display = 'none';

            if (email === "pharmacy@test.com" && password === "password123") {
                const loginButton     = document.getElementById('loginButton');
                const loginButtonText = document.getElementById('loginButtonText');
                loginButton.disabled  = true;
                loginButtonText.textContent = 'Connexion...';

                setTimeout(() => {
                    const token = "mock-token-pharmacy-123456";
                    const user = {
                        id: mockPharmacyData.id,
                        name: mockPharmacyData.pharmacyName,
                        email: email,
                        userType: "pharmacy"
                    };
                    
                    if (typeof Auth !== 'undefined') {
                        Auth.saveToken(token);
                        Auth.saveUser(user);
                        if (Auth.savePharmacy) Auth.savePharmacy(mockPharmacyData);
                    }
                    
                    localStorage.setItem('auth_token', token);
                    localStorage.setItem('user', JSON.stringify(user));
                    localStorage.setItem('pharmacy_data', JSON.stringify(mockPharmacyData));
                    
                    const pharmaciesDB = JSON.parse(localStorage.getItem('pharmacies_db')) || [];
                    if (!pharmaciesDB.find(p => p.id === mockPharmacyData.id)) {
                        pharmaciesDB.push(mockPharmacyData);
                        localStorage.setItem('pharmacies_db', JSON.stringify(pharmaciesDB));
                    }
                    
                    window.location.href = 'pharmacy-dashboard.html';
                }, 800);
                return;
            }

            try {
                const loginButton     = document.getElementById('loginButton');
                const loginButtonText = document.getElementById('loginButtonText');
                loginButton.disabled  = true;
                loginButtonText.textContent = 'Connexion...';

                const response = await API.post('/auth/login', { email, password });
                Auth.saveToken(response.token);
                Auth.saveUser(response.user);
                Auth.savePharmacy(response.pharmacy);
                window.location.href = 'pharmacy-dashboard.html';
            } catch (error) {
                document.getElementById('errorMessage').style.display = 'flex';
                document.getElementById('errorText').textContent = error.message || 'Email ou mot de passe incorrect';
                loginButton.disabled = false;
                loginButtonText.textContent = 'Se connecter';
            }
        });
    </script>
</body>
</html>
