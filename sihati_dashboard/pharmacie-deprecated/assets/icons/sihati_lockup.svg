<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="440" height="100">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@800&amp;display=swap');</style>
  </defs>

  <!-- DNA icon mark — no background, transparent -->
  <!-- Backbone rungs -->
  <line x1="32" y1="23" x2="68" y2="23" stroke="rgba(255,255,255,0.55)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="38" y1="34" x2="62" y2="34" stroke="rgba(255,255,255,0.45)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="44" y1="43" x2="56" y2="43" stroke="rgba(255,255,255,0.32)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="44" y1="57" x2="56" y2="57" stroke="rgba(255,255,255,0.32)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="38" y1="66" x2="62" y2="66" stroke="rgba(255,255,255,0.45)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="77" x2="68" y2="77" stroke="rgba(255,255,255,0.55)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Strand B teal -->
  <path d="M 26,10 C 8,22 8,38 50,50 C 92,62 92,78 74,90"
        fill="none" stroke="#00BFA5" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Strand A white -->
  <path d="M 74,10 C 92,22 92,38 50,50 C 8,62 8,78 26,90"
        fill="none" stroke="white" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Rung nodes -->
  <circle cx="32" cy="23" r="2.5" fill="#00BFA5"/><circle cx="68" cy="23" r="2.5" fill="white"/>
  <circle cx="38" cy="34" r="2.5" fill="#00BFA5"/><circle cx="62" cy="34" r="2.5" fill="white"/>
  <circle cx="44" cy="43" r="2"   fill="#00BFA5"/><circle cx="56" cy="43" r="2"   fill="white"/>
  <circle cx="44" cy="57" r="2"   fill="white"/>  <circle cx="56" cy="57" r="2"   fill="#00BFA5"/>
  <circle cx="38" cy="66" r="2.5" fill="white"/>  <circle cx="62" cy="66" r="2.5" fill="#00BFA5"/>
  <circle cx="32" cy="77" r="2.5" fill="white"/>  <circle cx="68" cy="77" r="2.5" fill="#00BFA5"/>

  <!-- Center crossing dot -->
  <circle cx="50" cy="50" r="4.5" fill="#64FFDA"/>
  <circle cx="50" cy="50" r="2.5" fill="white"/>

  <!-- Terminal dots -->
  <circle cx="74" cy="10" r="5.5" fill="white"/>
  <circle cx="26" cy="10" r="5.5" fill="#00BFA5"/>
  <circle cx="26" cy="90" r="5.5" fill="white"/>
  <circle cx="74" cy="90" r="5.5" fill="#00BFA5"/>

  <!-- SIHATI wordmark -->
  <text x="104" y="70"
        font-family="Poppins, sans-serif"
        font-size="58"
        font-weight="800"
        fill="white"
        letter-spacing="3">SIHATI</text>
</svg>
