name: sihati_mobile
description: Healthcare platform connecting patients with pharmacies and doctors in Algeria
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  get: ^4.6.6

  # Networking (for future backend integration)
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  get_storage: ^2.1.1

  # Location & Maps
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # UI Components
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # Forms & Validation
  email_validator: ^2.1.17

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.3
  permission_handler: ^11.2.0
  mapbox_maps_flutter: ^2.19.1
  latlong2: ^0.9.1
  google_generative_ai: ^0.4.7
  table_calendar: ^3.1.3
  share_plus: ^12.0.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/mock_data/

